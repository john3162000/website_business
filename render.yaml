services:
  - type: web
    name: karbon-dash-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python Web_deployment.py
    envVars:
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DASH_PASS
        sync: false
