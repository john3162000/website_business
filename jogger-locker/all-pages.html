r: var(--ink-2); }\n.hero-note { color: var(--ink-2); max-width: 34ch; }\n.kpis {\n  display: grid;\n  grid-template-columns: repeat(4, minmax(0, 1fr));\n  gap: 20px;\n  margin: 0;\n}\n.kpi { display: grid; gap: 4px; align-content: start; padding-top: 12px; border-top: 1px solid var(--line); }\n.kpi dt { font-size: 13px; color: var(--ink-2); }\n.kpi dd { margin: 0; font: 600 28px/1.1 var(--font-ui); }\n.kpi dd small { display: block; margin-top: 4px; font: 400 13px/1.35 var(--font-ui); color: var(--muted); }\n.facts {\n  grid-column: 1 / -1;\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 16px 28px;\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n.facts li { display: grid; gap: 2px; color: var(--ink-2); font-size: 14px; }\n.facts strong { color: var(--ink); font-size: 15px; font-weight: 600; }\n\n/* Legend */\n.legend {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px 20px;\n  margin: 0;\n  padding: 0;\n  list-style: none;\n  font-size: 13px;\n  color: var(--ink-2);\n}\n.legend li { display: inline-flex; align-items: center; gap: 8px; }\n.sw { width: 14px; height: 14px; border-radius: 3px; flex: none; }\n.sw-day {\n  display: grid; grid-template-rows: 1fr 1fr; gap: 2px;\n  width: 16px; height: 16px; border-radius: 3px; overflow: hidden; flex: none;\n}\n.sw-day i { background: var(--rain-0); }\n.sw-day i:first-child { background: var(--rain-2); }\n\n/* Calendar */\n.calendar {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));\n  gap: 24px 26px;\n  border-radius: 8px;\n}\n.calendar:focus-visible { outline: 2px solid var(--accent); outline-offset: 8px; }\n.cal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }\n.cal-title { font-weight: 600; font-size: 14px; white-space: nowrap; }\n.cal-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }\n.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }\n.cal-dow { font-size: 10px; line-height: 16px; text-align: center; color: var(--muted); }\n.cal-day {\n  aspect-ratio: 1 / 1;\n  max-width: 100%;\n  display: grid;\n  grid-template-rows: 1fr 1fr;\n  gap: 2px;\n  border-radius: 3px;\n  overflow: hidden;\n}\n.cal-day i { display: block; }\n.cal-day.is-outside { visibility: hidden; }\n.cal-day[data-i] { cursor: pointer; }\n.cal-day[data-i]:hover { outline: 2px solid var(--ink-2); outline-offset: 1px; }\n.cal-day.is-focus { outline: 2px solid var(--ink); outline-offset: 1px; }\n.s-dry { background: var(--rain-0); }\n.s-drizzle { background: var(--rain-1); }\n.s-out { background: var(--rain-2); }\n\n/* Cards and charts */\n.card {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 20px;\n  display: grid;\n  gap: 12px;\n  min-width: 0;\n}\n.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }\n.chart { width: 100%; min-width: 0; }\n.chart svg { display: block; width: 100%; height: auto; overflow: visible; }\n.chart text { font-family: var(--font-ui); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }\n.chart .val { fill: var(--ink-2); font-weight: 600; }\n.chart .hit { fill: transparent; cursor: pointer; outline: none; }\n.chart .hit:focus-visible { stroke: var(--ink); stroke-width: 2; }\n.caption { font-size: 13px; color: var(--muted); max-width: 80ch; }\n.toggle {\n  font: 600 13px/1 var(--font-ui);\n  color: var(--ink);\n  background: transparent;\n  border: 1px solid var(--line);\n  border-radius: 999px;\n  padding: 8px 14px;\n  cursor: pointer;\n}\n.toggle:hover { border-color: var(--axis); }\n.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n.table-wrap { overflow-x: auto; }\ntable { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }\nth, td { text-align: right; padding: 7p  the two hours before.\u003c/p>\n  \u003c/header>\n\n  \u003csection class=\"summary\" aria-label=\"Summary\">\n    \u003cdiv>\n      \u003cp class=\"hero-label\">Joggable windows in the last 365 days\u003c/p>\n      \u003cp class=\"hero-value\">\u003cspan id=\"heroCount\">\u003c/span> \u003csmall id=\"heroOf\">\u003c/small>\u003c/p>\n      \u003cp class=\"hero-note\" id=\"heroNote\">\u003c/p>\n    \u003c/div>\n    \u003cdl class=\"kpis\">\n      \u003cdiv class=\"kpi\">\u003cdt>Mornings, 5\u20138 AM\u003c/dt>\u003cdd>\u003cspan id=\"kAm\">\u003c/span>\u003csmall id=\"kAmNote\">\u003c/small>\u003c/dd>\u003c/div>\n      \u003cdiv class=\"kpi\">\u003cdt>Evenings, 5\u20138 PM\u003c/dt>\u003cdd>\u003cspan id=\"kPm\">\u003c/span>\u003csmall id=\"kPmNote\">\u003c/small>\u003c/dd>\u003c/div>\n      \u003cdiv class=\"kpi\">\u003cdt>Days with no joggable window\u003c/dt>\u003cdd>\u003cspan id=\"kNone\">\u003c/span>\u003csmall id=\"kNoneNote\">\u003c/small>\u003c/dd>\u003c/div>\n      \u003cdiv class=\"kpi\">\u003cdt>Longest washout\u003c/dt>\u003cdd>\u003cspan id=\"kWash\">\u003c/span>\u003csmall id=\"kWashNote\">\u003c/small>\u003c/dd>\u003c/div>\n    \u003c/dl>\n    \u003cul class=\"facts\" id=\"facts\">\u003c/ul>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"calTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"calTitle\">Every window, day by day\u003c/h2>\n      \u003cp class=\"section-note\">Each square is one day. The top half is the 5\u20138 AM window and the bottom half is 5\u20138 PM. Darker means wetter. The number beside each month is joggable windows out of all windows. Hover or tap a day for the rain figures, or focus the calendar and use the arrow keys.\u003c/p>\n    \u003c/div>\n    \u003cul class=\"legend\">\n      \u003cli>\u003cspan class=\"sw s-dry\">\u003c/span>Dry: jogged\u003c/li>\n      \u003cli>\u003cspan class=\"sw s-drizzle\">\u003c/span>Light drizzle, under 0.5 mm/h: jogged\u003c/li>\n      \u003cli>\u003cspan class=\"sw s-out\">\u003c/span>Rained out\u003c/li>\n      \u003cli>\u003cspan class=\"sw-day\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>Example: rained-out morning, dry evening\u003c/li>\n    \u003c/ul>\n    \u003cdiv class=\"calendar\" id=\"calendar\" tabindex=\"0\" aria-label=\"Calendar of jogging windows, 21 September 2025 to 20 September 2026. Use the arrow keys to move between days.\" aria-describedby=\"calLive\">\u003c/div>\n    \u003cp class=\"sr-only\" id=\"calLive\" aria-live=\"polite\">\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"monthTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"monthTitle\">Joggable windows per month\u003c/h2>\n      \u003cp class=\"section-note\" id=\"monthNote\">\u003c/p>\n    \u003c/div>\n    \u003cfigure class=\"card\" style=\"margin:0\">\n      \u003cdiv class=\"chart\" id=\"monthChart\">\u003c/div>\n      \u003cfigcaption class=\"caption\">Dark bars: joggable windows. Pale bars: every window in the month (two per day), so the pale part is what rain took. The number on each bar is the joggable count. Oct\u2013Dec are 2025 and Jan\u2013Aug are 2026. Sep* combines 21\u201330 Sep 2025 with 1\u201320 Sep 2026.\u003c/figcaption>\n      \u003cdiv>\u003cbutton class=\"toggle\" type=\"button\" id=\"monthToggle\" aria-expanded=\"false\" aria-controls=\"monthTableWrap\">Show table\u003c/button>\u003c/div>\n      \u003cdiv class=\"table-wrap\" id=\"monthTableWrap\" hidden>\n        \u003ctable>\n          \u003cthead>\u003ctr>\u003cth scope=\"col\">Month\u003c/th>\u003cth scope=\"col\">Joggable\u003c/th>\u003cth scope=\"col\">Of\u003c/th>\u003cth scope=\"col\">Share\u003c/th>\u003cth scope=\"col\">Mornings\u003c/th>\u003cth scope=\"col\">Evenings\u003c/th>\u003cth scope=\"col\">Rain (mm)\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody id=\"monthTable\">\u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n    \u003c/figure>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"calcTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"calcTitle\">What the weather means for a 30-locker kiosk\u003c/h2>\n      \u003cp class=\"section-note\">Revenue is counted only in joggable windows. Move the sliders to match your quotes and your own head count at the Oval.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"calc\">\n        \u003cfieldset class=\"inputs\">\n          \u003clegend class=\"sr-only\">Assumptions\u003c/legend>\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"field-top\">\u003clabel for=\"rWkd\">Rentals per joggable window, weekdays\u003c/label>\u003coutput id=\"rWkdOut\" for=\"rWkd\">\u003c/output>\u003c/div>\n            \u003cinput type=\"range\" id=\"rWkd\" min=\"0\" max=\"60\" step=\"1\" value=\"10\">\n          \u003c/div>\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"field-top\">\u003clabel for=\"rWke\">Rentals per joggable window, weekends\u003c/label>\u003coutput id=\"rWkeOut\" for=\"rWke\">\u003c/output>\u003c/div>\n            \u003cinput type=\"range\" id=\"rWke\" min=\"0\" max=\"60\" step=\"1\" value=\"15\">\n            \u003cp class=\"hint\" id=\"capHint\">30 means every locker is used once per window. Above 30, lockers turn over within the same 3 hours.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"field-top\">\u003clabel for=\"price\">Price per rental (4 hours)\u003c/label>\u003coutput id=\"priceOut\" for=\"price\">\u003c/output>\u003c/div>\n            \u003cinput type=\"range\" id=\"price\" min=\"20\" max=\"150\" step=\"5\" value=\"50\">\n          \u003c/div>\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"field-top\">\u003clabel for=\"fees\">Payment fee and SMS per rental\u003c/label>\u003coutput id=\"feesOut\" for=\"fees\">\u003c/output>\u003c/div>\n            \u003cinput type=\"range\" id=\"fees\" min=\"0\" max=\"10\" step=\"0.5\" value=\"3\">\n          \u003c/div>\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"field-top\">\u003clabel for=\"rent\">Monthly rent\u003c/label>\u003coutput id=\"rentOut\" for=\"rent\">\u003c/output>\u003c/div>\n            \u003cinput type=\"range\" id=\"rent\" min=\"0\" max=\"40000\" step=\"500\" value=\"10000\">\n          \u003c/div>\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"field-top\">\u003clabel for=\"fixed\">Other monthly costs\u003c/label>\u003coutput id=\"fixedOut\" for=\"fixed\">\u003c/output>\u003c/div>\n            \u003cinput type=\"range\" id=\"fixed\" min=\"0\" max=\"20000\" step=\"500\" value=\"6000\">\n            \u003cp class=\"hint\">Electricity, internet, server, repairs and a part-time checker.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"field-top\">\u003clabel for=\"setup\">Setup cost\u003c/label>\u003coutput id=\"setupOut\" for=\"setup\">\u003c/output>\u003c/div>\n            \u003cinput type=\"range\" id=\"setup\" min=\"50000\" max=\"400000\" step=\"5000\" value=\"180000\">\n          \u003c/div>\n        \u003c/fieldset>\n        \u003cdiv style=\"display:grid; gap:20px; min-width:0\">\n          \u003cdl class=\"results\">\n            \u003cdiv class=\"result\">\u003cdt>Profit in a year\u003c/dt>\u003cdd>\u003cspan id=\"oProfit\">\u003c/span>\u003csmall id=\"oProfitNote\">\u003c/small>\u003c/dd>\u003c/div>\n            \u003cdiv class=\"result\">\u003cdt>Pays back setup in\u003c/dt>\u003cdd>\u003cspan id=\"oPayback\">\u003c/span>\u003csmall id=\"oPaybackNote\">\u003c/small>\u003c/dd>\u003c/div>\n            \u003cdiv class=\"result\">\u003cdt>Revenue in a year\u003c/dt>\u003cdd>\u003cspan id=\"oRevenue\">\u003c/span>\u003csmall id=\"oRevenueNote\">\u003c/small>\u003c/dd>\u003c/div>\n            \u003cdiv class=\"result\">\u003cdt>Revenue lost to rain\u003c/dt>\u003cdd>\u003cspan id=\"oLost\">\u003c/span>\u003csmall id=\"oLostNote\">\u003c/small>\u003c/dd>\u003c/div>\n            \u003cdiv class=\"result\">\u003cdt>Break-even\u003c/dt>\u003cdd>\u003cspan id=\"oBreak\">\u003c/span>\u003csmall id=\"oBreakNote\">\u003c/small>\u003c/dd>\u003c/div>\n            \u003cdiv class=\"result\">\u003cdt>Months that lose money\u003c/dt>\u003cdd>\u003cspan id=\"oLossMonths\">\u003c/span>\u003csmall id=\"oLossNote\">\u003c/small>\u003c/dd>\u003c/div>\n          \u003c/dl>\n          \u003cp class=\"assumption\">The rentals per window are guesses, not measurements. Count people carrying bags at the Oval on a few weekday and weekend peaks, then set the sliders to that.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cfigure class=\"card\" style=\"margin:0\">\n      \u003cdiv class=\"card-head\">\u003ch3>Profit by month\u003c/h3>\u003cspan class=\"caption\" id=\"profitSub\">\u003c/span>\u003c/div>\n      \u003cdiv class=\"chart\" id=\"profitChart\">\u003c/div>\n      \u003cfigcaption class=\"caption\">Gray bars are profitable months; red bars lose money. Profit is revenue minus payment fees, SMS, rent and other costs.\u003c/figcaption>\n      \u003cdiv>\u003cbutton class=\"toggle\" type=\"button\" id=\"profitToggle\" aria-expanded=\"false\" aria-controls=\"profitTableWrap\">Show table\u003c/button>\u003c/div>\n      \u003cdiv class=\"table-wrap\" id=\"profitTableWrap\" hidden>\n        \u003ctable>\n          \u003cthead>\u003ctr>\u003cth scope=\"col\">Month\u003c/th>\u003cth scope=\"col\">Joggable windows\u003c/th>\u003cth scope=\"col\">Rentals\u003c/th>\u003cth scope=\"col\">Revenue\u003c/th>\u003cth scope=\"col\">Costs\u003c/th>\u003cth scope=\"col\">Profit\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody id=\"profitTable\">\u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n    \u003c/figure>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"checkTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"checkTitle\">How firm are these numbers?\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"pair\">\n      \u003cdiv class=\"card\">\n        \u003ch3>If \u201crained out\u201d is stricter or looser\u003c/h3>\n        \u003cdiv class=\"table-wrap\">\n          \u003ctable class=\"wrap\">\n            \u003cthead>\u003ctr>\u003cth scope=\"col\">Rule\u003c/th>\u003cth scope=\"col\" class=\"num\">Joggable\u003c/th>\u003cth scope=\"col\" class=\"num\">vs. this page\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody id=\"sensTable\">\u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n        \u003cp class=\"caption\">Revenue moves with the joggable count, so a stricter reading of rain cuts the figures above by about the same share.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"card\">\n        \u003ch3>Wettest days of the year\u003c/h3>\n        \u003cdiv class=\"table-wrap\">\n          \u003ctable class=\"wrap\">\n            \u003cthead>\u003ctr>\u003cth scope=\"col\" class=\"num\">Date\u003c/th>\u003cth scope=\"col\" class=\"num\">Rain\u003c/th>\u003cth scope=\"col\">5\u20138 AM\u003c/th>\u003cth scope=\"col\">5\u20138 PM\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody id=\"wetTable\">\u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cul class=\"method\" id=\"method\">\u003c/ul>\n  \u003c/section>\n\n  \u003cfooter class=\"footer\">\n    \u003cp>Weather data: \u003ca href=\"https://open-meteo.com/\" rel=\"noopener\">Open-Meteo.com\u003c/a> historical archive (CC BY 4.0).\u003c/p>\n    \u003cp>Analysis: \u003ccode>jogger-locker/weather_analysis.py\u003c/code> on branch \u003ccode>claude/jogger-locker-kiosk-r03nh0\u003c/code> of john3162000/website_business.\u003c/p>\n  \u003c/footer>\n\u003c/main>\n\u003cdiv class=\"tip\" id=\"tip\" role=\"tooltip\" hidden>\u003c/div>\n\n\u003cscript>\nconst S = {\"location\":{\"name\":\"UP Diliman Academic Oval\",\"lat\":14.6537,\ ) return [\"Rained out\", `${WIN[w]} \u00b7 peak ${d[w + \"_mm\"]} mm/h`];\n  return [\"No data\", WIN[w]];\n}\nfunction dayTip(i) {\n  const d = DAYS[i];\n  const rows = [tipTitle(longDate(d.date))];\n  for (const w of [\"am\", \"pm\"]) {\n    const [strong, rest] = windowWords(d, w);\n    rows.push(tipRow(cssVar(STATE_VAR[d[w]] || \"--grid\"), strong, rest));\n  }\n  rows.push(el(\"div\", \"tip-foot\", `Rain that day: ${d.mm} mm`));\n  return rows;\n}\ncal.addEventListener(\"pointerover\", (e) => {\n  const c = e.target.closest(\".cal-day[data-i]\");\n  if (c) showTip(dayTip(Number(c.dataset.i)), c);\n});\ncal.addEventListener(\"pointerleave\", () => { if (document.activeElement !== cal) hideTip(); });\n\nlet focusI = null;\nfunction focusDay(i) {\n  if (focusI !== null && cells[focusI]) cells[focusI].classList.remove(\"is-focus\");\n  focusI = i;\n  const c = cells[i];\n  c.classList.add(\"is-focus\");\n  c.scrollIntoView({ block: \"nearest\", inline: \"nearest\" });\n  showTip(dayTip(i), c);\n  const d = DAYS[i];\n  setText(\"calLive\", `${longDate(d.date)}. Morning: ${windowWords(d, \"am\").join(\", \")}. Evening: ${windowWords(d, \"pm\").join(\", \")}. Rain that day ${d.mm} millimetres.`);\n}\n// A click or tap sets the starting day; only keyboard focus moves the highlight.\ncal.addEventListener(\"pointerdown\", (e) => {\n  const c = e.target.closest(\".cal-day[data-i]\");\n  if (c) focusI = Number(c.dataset.i);\n});\ncal.addEventListener(\"focus\", () => { if (cal.matches(\":focus-visible\")) focusDay(focusI ?? 0); });\ncal.addEventListener(\"blur\", () => {\n  if (focusI !== null && cells[focusI]) cells[focusI].classList.remove(\"is-focus\");\n  hideTip();\n});\ncal.addEventListener(\"keydown\", (e) => {\n  const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 };\n  let next = null;\n  if (e.key in moves) next = (focusI ?? 0) + moves[e.key];\n  else if (e.key === \"Home\") next = 0;\n  else if (e.key === \"End\") next = DAYS.length - 1;\n  else if (e.key === \"Escape\") { hideTip(); return; }\n  if (next === null) return;\n  e.preventDefault();\n  focusDay(Math.max(0, Math.min(DAYS.length - 1, next)));\n});\n\n/* ---------- Monthly chart ---------- */\nfunction drawMonthly() {\n  const box = document.getElementById(\"monthChart\");\n  const W = Math.max(280, box.clientWidth), H = 250;\n  const m = { l: 30, r: 6, t: 20, b: 26 };\n  const pw = W - m.l - m.r, ph = H - m.t - m.b;\n  const maxY = 64;\n  const y = (v) => m.t + ph - (v / maxY) * ph;\n  const band = pw / 12, bw = Math.min(24, band * 0.62);\n  const svg = sv(\"svg\", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: \"img\",\n    \"aria-label\": \"Joggable windows per month. \" + MONTHS.map((mm) => `${mm.name}: ${mm.jog} of ${mm.windows}`).join(\"; \") });\n  for (const t of [0, 20, 40, 60]) {\n    svg.append(sv(\"line\", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t === 0 ? cssVar(\"--axis\") : cssVar(\"--grid\"), \"stroke-width\": 1, \"shape-rendering\": \"crispEdges\" }));\n    svg.append(sv(\"text\", { x: m.l - 8, y: y(t) + 4, \"text-anchor\": \"end\" }, String(t)));\n  }\n  MONTHS.forEach((mo, i) => {\n    const x = m.l + band * i + (band - bw) / 2;\n    svg.append(sv(\"path\", { d: colPath(x, y(0), bw, y(mo.windows)), fill: cssVar(\"--track\") }));\n    svg.append(sv(\"path\", { d: colPath(x, y(0), bw, y(mo.jog)), fill: cssVar(\"--bar\") }));\n    svg.append(sv(\"text\", { x: x + bw / 2, y: y(mo.jog) - 6, \"text-anchor\": \"middle\", class: \"val\" }, String(mo.jog)));\n    svg.append(sv(\"text\", { x: x + bw / 2, y: H - 8, \"text-anchor\": \"middle\" }, axisMonth(mo.name, band)));\n    const hit = sv(\"rect\", { x: m.l + band * i, y: m.t - 14, width: band, height: ph + 14 + m.b, class: \"hit\", tabindex: 0, role: \"img\",\n      \"aria-label\": `${mo.name}: ${mo.jog} of ${mo.windows} windows joggable` });\n    const show = () => showTip([\n      tipTitle(mo.name === \"Sep*\" ? \"September (2025 + 2026)\" : `${mo.name} ${i >= 9 ? 2025 : 2026}`),\n      tipRow(cssVar(\"--bar\"), `${mo.jog} of ${mo.windows}`, `windows joggable \u00b7 ${pct(mo.jog, mo.windows)}`),\n      tipRow(\"\", `${mo.am} mornings, ${mo.pm} evenings`, \"\"),\n      el(\"div\", \"tip-foot\", `Rain: ${Math.round(mo.rain)} mm`),\n    ], hit);\n    hit.addEventListener(\"pointerenter\", show);\n    hit.addEventListener(\"focus\", show);\n    hit.addEventListener(\"pointerleave\", hideTip);\n    hit.addEventListener(\"blur\", hideTip);\n    svg.append(hit);\n  });\n  box.replaceChildren(svg);\n}\n(function monthTable() {\n  const tb = document.getElementById(\"monthTable\");\n  for (const mo of MONTHS) {\n    const tr = el(\"tr\");\n    for (const v of [mo.name, mo.jog, mo.windows, pct(mo.jog, mo.windows), mo.am, mo.pm, Math.round(mo.rain)]) tr.append(el(\"td\", \"\", String(v)));\n    tb.append(tr);\n  }\n})();\n\n/* ---------- Calculator ---------- */\nconst IDS = [\"rWkd\", \"rWke\", \"price\", \"fees\", \"rent\", \"fixed\", \"setup\"];\nconst FORMAT = {\n  rWkd: (v) => String(v), rWke: (v) => String(v),\n  price: (v) => peso(v), fees: (v) => \"\u20b1\" + v.toFixed(2).replace(/\\.00$/, \"\"),\n  rent: (v) => peso(v), fixed: (v) => peso(v), setup: (v) => peso(v),\n};\nfunction readInputs() {\n  const p = {};\n  for (const id of IDS) p[id] = Number(document.getElementById(id).value);\n  return p;\n}\nfunction compute(p) {\n  const rows = MONTHS.map((mo) => {\n    const rentals = mo.wkdJ * p.rWkd + mo.wkeJ * p.rWke;\n    const revenue = rentals * p.price;\n    const costs = rentals * p.fees + p.rent + p.fixed;\n    const ideal = (mo.wkdW * p.rWkd + mo.wkeW * p.rWke) * p.price;\n    return { mo, rentals, revenue, costs, profit: revenue - costs, ideal };\n  });\n  const tot = (k) => rows.reduce((a, r) => a + r[k], 0);\n  return { rows, rentals: tot(\"rentals\"), revenue: tot(\"revenue\"), profit: tot(\"profit\"), ideal: tot(\"ideal\") };\n}\n\nfunction niceStep(raw) {\n  const p = Math.pow(10, Math.floor(Math.log10(raw)));\n  const n = raw / p;\n  return (n \u003c= 1 ? 1 : n \u003c= 2 ? 2 : n \u003c= 2.5 ? 2.5 : n \u003c= 5 ? 5 : 10) * p;\n}\nfunction drawProfit(res) {\n  const box = document.getElementById(\"profitChart\");\n  const W = Math.max(280, box.clientWidth), H = 250;\n  const m = { l: 48, r: 6, t: 16, b: 26 };\n  const pw = W - m.l - m.r, ph = H - m.t - m.b;\n  const vals = res.rows.map((r) => r.profit);\n  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);\n  const step = niceStep(Math.max(1000, (hi - lo) / 4));\n  const d0 = Math.floor(lo / step) * step, d1 = Math.ceil(hi / step) * step || step;\n  const y = (v) => m.t + ((d1 - v) / (d1 - d0)) * ph;\n  const band = pw / 12, bw = Math.min(24, band * 0.62);\n  const svg = sv(\"svg\", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: \"img\",\n    \"aria-label\": \"Profit by month. \" + res.rows.map((r) => `${r.mo.name}: ${peso(r.profit)}`).join(\"; \") });\n  for (let t = d0; t \u003c= d1 + 1e-6; t += step) {\n    svg.append(sv(\"line\", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: cssVar(\"--grid\"), \"stroke-width\": 1, \"shape-rendering\": \"crispEdges\" }));\n    svg.append(sv(\"text\", { x: m.l - 8, y: y(t) + 4, \"text-anchor\": \"end\" }, pesoK(t)));\n  }\n  svg.append(sv(\"line\", { x1: m.l, x2: W - m.r, y1: y(0), y2: y(0), stroke: cssVar(\"--axis\"), \"stroke-width\": 1, \"shape-rendering\": \"crispEdges\" }));\n  let lastRight = -Infinity;\n  const minIdx = vals.indexOf(Math.min(...vals));\n  res.rows.forEach((r, i) => {\n    const x = m.l + band * i + (band - bw) / 2;\n    const neg = r.profit \u003c 0;\n    svg.append(sv(\"path\", { d: colPath(x, y(0), bw, y(r.profit)), fill: cssVar(neg ? \"--loss\" : \"--bar\") }));\n    svg.append(sv(\"text\", { x: x + bw / 2, y: H - 8, \"text-anchor\": \"middle\" }, axisMonth(r.mo.name, band)));\n    if (neg || i === minIdx) {\n      const label = pesoK(r.profit);\n      const w = label.length * 6.4;\n      const cx = x + bw / 2;\n      const ly = neg ? y(r.profit) + 14 : y(r.profit) - 6;\n      if (cx - w / 2 > lastRight + 4 && ly \u003c H - m.b + 2) {\n        svg.append(sv(\"text\", { x: cx, y: ly, \"text-anchor\": \"middle\", class: \"val\" }, label));\n        lastRight = cx + w / 2;\n      }\n    }\n    const hit = sv(\"rect\", { x: m.l + band * i, y: m.t, width: band, height: ph + m.b, class: \"hit\", tabindex: 0, role: \"img\",\n      \"aria-label\": `${r.mo.name}: profit ${peso(r.profit)}` });\n    const show = () => showTip([\n      tipTitle(r.mo.name === \"Sep*\" ? \"September (2025 + 2026)\" : `${r.mo.name} ${i >= 9 ? 2025 : 2026}`),\n      tipRow(cssVar(neg ? \"--loss\" : \"--bar\"), peso(r.profit), neg ? \"loss\" : \"profit\"),\n      tipRow(\"\", num(r.rentals) + \" rentals\", `in ${r.mo.jog} joggable windows`),\n      el(\"div\", \"tip-foot\", `Revenue ${peso(r.revenue)} \u00b7 costs ${peso(r.costs)}`),\n    ], hit);\n    hit.addEventListener(\"pointerenter\", show);\n    hit.addEventListener(\"focus\", show);\n    hit.addEventListener(\"pointerleave\", hideTip);\n    hit.addEventListener(\"blur\", hideTip);\n    svg.append(hit);\n  });\n  box.replaceChildren(svg);\n}\n\nlet lastRes = null;\nfunction update() {\n  const p = readInputs();\n  for (const id of IDS) setText(id + \"Out\", FORMAT[id](p[id]));\n  const res = compute(p);\n  lastRes = res;\n  const net = p.price - p.fees;\n  const J = T.jogged;\n  setText(\"oProfit\", peso(res.profit));\n  setText(\"oProfitNote\", `${peso(res.profit / 12)} a month on average`);\n  if (res.profit > 0) {\n    const months = Math.ceil(p.setup / (res.profit / 12));\n    setText(\"oPayback\", `${months} months`);\n    setText(\"oPaybackNote\", months > 36 ? \"Slow: over 3 years\" : `on a ${peso(p.setup)} setup`);\n  } else {\n    setText(\"oPayback\", \"Never\");\n    setText(\"oPaybackNote\", \"The kiosk loses money over the year\");\n  }\n  setText(\"oRevenue\", peso(res.revenue));\n  setText(\"oRevenueNote\", `${num(res.rentals)} rentals`);\n  const lost = res.ideal - res.revenue;\n  setText(\"oLost\", peso(lost));\n  setText(\"oLostNote\", res.ideal > 0 ? `${pct(lost, res.ideal)} of what a rain-free year would bring` : \"\");\n  if (net > 0) {\n    const be = (12 * (p.rent + p.fixed)) / (J * net);\n    setText(\"oBreak\", `${be.toFixed(1)} per window`);\n    setText(\"oBreakNote\", `about ${((be * J) / DAYS.length).toFixed(1)} rentals a day on average`);\n  } else {\n    setText(\"oBreak\", \"Not possible\");\n    setText(\"oBreakNote\", \"Fees are as high as the price\");\n  }\n  const losing = res.rows.filter((r) => r.profit \u003c 0);\n  setText(\"oLossMonths\", losing.length ? String(losing.length) : \"None\");\n  setText(\"oLossNote\", losing.length ? losing.map((r) => r.mo.name.replace(\"*\", \"\")).join(\", \") : \"Every month covers its costs\");\n  setText(\"profitSub\", `Rent ${peso(p.rent)} \u00b7 ${p.rWkd} weekday / ${p.rWke} weekend rentals per joggable window`);\n  document.getElementById(\"capHint\").style.color = p.rWkd > 30 || p.rWke > 30 ? \"var(--ink)\" : \"\";\n  const tb = document.getElementById(\"profitTable\");\n  tb.replaceChildren();\n  for (const r of res.rows) {\n    const tr = el(\"tr\");\n    for (const v of [r.mo.name, r.mo.jog, num(r.rentals), peso(r.revenue), peso(r.costs), peso(r.profit)]) tr.append(el(\"td\", \"\", String(v)));\n    tb.append(tr);\n  }\n  const tr = el(\"tr\");\n  for (const v of [\"Year\", J, num(res.rentals), peso(res.revenue), peso(res.revenue - res.profit), peso(res.profit)]) tr.append(el(\"td\", \"\", String(v)));\n  tr.style.fontWeight = \"600\";\n  tb.append(tr);\n  drawProfit(res);\n}\nfor (const id of IDS) document.getElementById(id).addEventListener(\"input\", update);\n\n/* ---------- Sensitivity, wettest days, method ---------- */\n(function lower() {\n  const sens = M.sensitivity;\n  const base = sens[\"limit_0.5\"];\n  const rows = [\n    [\"Any hour at 0.2 mm or more\", sens[\"limit_0.2\"]],\n    [\"Any hour at 0.5 mm or more (this page)\", base],\n    [\"Any hour at 1.0 mm or more\", sens[\"limit_1.0\"]],\n    [\"0.5 mm, ignoring downpours just before\", sens[\"no_downpour_rule\"]],\n  ];\n  const tb = document.getElementById(\"sensTable\");\n  for (const [rule, n] of rows) {\n    const diff = n === base ? \"\u2014\" : `${n > base ? \"+\" : \"\u2212\"}${Math.abs(Math.round((100 * (n - base)) / base))}%`;\n    const tr = el(\"tr\");\n    tr.append(el(\"td\", \"\", rule), el(\"td\", \"num\", `${num(n)} \u00b7 ${pct(n, T.sessions)}`), el(\"td\", \"num\", diff));\n    tb.append(tr);\n  }\n  const byDate = new Map(DAYS.map((d) => [d.date, d]));\n  const wet = document.getElementById(\"wetTable\");\n  const label = { dry: \"Jogged\", drizzle: \"Jogged\", out: \"Rained out\" };\n  for (const w of M.wettest_days.slice(0, 6)) {\n    const d = byDate.get(w.date);\n    const tr = el(\"tr\");\n    tr.append(el(\"td\", \"num\", shortDate(w.date)), el(\"td\", \"num\", `${w.mm} mm`),\n      el(\"td\", \"\", label[d.am] || \"\u2014\"), el(\"td\", \"\", label[d.pm] || \"\u2014\"));\n    wet.append(tr);\n  }\n  const g = M.grid_point;\n  const where = g\n    ? `the nearest weather-model grid point, ${g.lat.toFixed(3)}\u00b0 N, ${g.lon.toFixed(3)}\u00b0 E, about ${S.gridKm.toFixed(0)} km from the Oval`\n    : \"the weather-model grid point nearest the Oval\";\n  const items = [\n    [\"Data.\", ` Hourly rain from the Open-Meteo historical archive for ${where}. Total rain for the 365 days: ${num(M.annual_rain_mm)} mm.`],\n    [\"Rule.\", \" A window is rained out when any hour inside it reaches 0.5 mm, or when an hour in the two hours before reaches 2.5 mm (a downpour that wets the track and makes people cancel). Drizzle under 0.5 mm/h counts as jogged.\"],\n    [\"Model rain, not a gauge.\", \" The archive blends weather-model and reanalysis data over a grid cell a few kilometres wide. It can miss a short downpour right on the Oval or spread one across neighbouring hours. The table above shows how much that matters.\"],\n    [\"Possible jogging, not actual joggers.\", \" This counts when people could jog. How many rent a locker in each window is still an assumption until you count at the Oval.\"],\n    [\"Not included.\", \" Semester breaks, holidays, heat, air quality and events that close the Oval.\"],\n  ];\n  const ul = document.getElementById(\"method\");\n  for (const [b, t] of items) {\n    const li = el(\"li\");\n    li.append(el(\"strong\", \"\", b), document.createTextNode(t));\n    ul.append(li);\n  }\n})();\n\n/* ---------- Toggles and resizing ---------- */\nfunction wireToggle(btnId, wrapId) {\n  const btn = document.getElementById(btnId), wrap = document.getElementById(wrapId);\n  btn.addEventListener(\"click\", () => {\n    wrap.hidden = !wrap.hidden;\n    btn.setAttribute(\"aria-expanded\", String(!wrap.hidden));\n    btn.textContent = wrap.hidden ? \"Show table\" : \"Hide table\";\n  });\n}\nwireToggle(\"monthToggle\", \"monthTableWrap\");\nwireToggle(\"profitToggle\", \"profitTableWrap\");\n\nfunction redraw() {\n  drawMonthly();\n  if (lastRes) drawProfit(lastRes);\n}\nupdate();\ndrawMonthly();\nlet lastW = 0;\nnew ResizeObserver(() => {\n  const w = document.getElementById(\"monthChart\").clientWidth;\n  if (Math.abs(w - lastW) > 2) { lastW = w; redraw(); }\n}).observe(document.getElementById(\"monthChart\"));\nmatchMedia(\"(prefers-color-scheme: dark)\").addEventListener(\"change\", redraw);\nnew MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: [\"data-theme\"] });\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"}, "design": {"title": "UP Oval Locker Bank", "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cbase target=\"_blank\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>UP Oval Locker Bank\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap\">\n\u003cstyle>\n:root {\n  color-scheme: light;\n  --bg: #f3f4f1;\n  --surface: #fcfcfb;\n  --ink: #0b0b0b;\n  --ink-2: #52514e;\n  --muted: #6b6a65;\n  --grid: #e1e0d9;\n  --line: rgba(11, 11, 11, 0.1);\n  --track: #ebeae4;\n  --accent: #7b1113;\n  --warn-bg: #fbeee0;\n  --warn-edge: #c7792a;\n  --body: #e4e3dd;\n  --panel: #cfcec6;\n  --panel-door: #e9e8e2;\n  --sign: #1d1d1b;\n  --sign-ink: #f5f5f2;\n  --plinth: #b3b2aa;\n  --housing: #3a3a37;\n  --screen: #111111;\n  --screen-ink: #dce8f8;\n  --interior: #f7f7f4;\n  --bag: #e3c3c4;\n  --bag-ink: #0b0b0b;\n  --zone: rgba(123, 17, 19, 0.07);\n  --hatch: #b3b2aa;\n  --door-s: #86b6ef;\n  --door-s-ink: #0b0b0b;\n  --door-m: #3987e5;\n  --door-m-ink: #0b0b0b;\n  --door-l: #1c5cab;\n  --door-l-ink: #ffffff;\n  --font-ui: \"Public Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --font-display: \"Barlow Condensed\", \"Arial Narrow\", \"Roboto Condensed\", system-ui, sans-serif;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    color-scheme: dark;\n    --bg: #0f100f;\n    --surface: #1a1a19;\n    --ink: #ffffff;\n    --ink-2: #c3c2b7;\n    --muted: #a3a29b;\n    --grid: #2c2c2a;\n    --line: rgba(255, 255, 255, 0.1);\n    --track: #262625;\n    --accent: #f0a0a3;\n    --warn-bg: #2e2418;\n    --warn-edge: #d99a4e;\n    --body: #2b2b29;\n    --panel: #3b3b37;\n    --panel-door: #31312e;\n    --sign: #e9e8e2;\n    --sign-ink: #111111;\n    --plinth: #4a4944;\n    --housing: #0c0c0b;\n    --screen: #000000;\n    --screen-ink: #cfe0f7;\n    --interior: #202020;\n    --bag: #6b3437;\n    --bag-ink: #ffffff;\n    --zone: rgba(240, 160, 163, 0.09);\n    --hatch: #4a4944;\n    --door-s: #184f95;\n    --door-s-ink: #ffffff;\n    --door-m: #3987e5;\n    --door-m-ink: #0b0b0b;\n    --door-l: #9ec5f4;\n    --door-l-ink: #0b0b0b;\n  }\n}\n:root[data-theme=\"dark\"] {\n  color-scheme: dark;\n  --bg: #0f100f;\n  --surface: #1a1a19;\n  --ink: #ffffff;\n  --ink-2: #c3c2b7;\n  --muted: #a3a29b;\n  --grid: #2c2c2a;\n  --line: rgba(255, 255, 255, 0.1);\n  --track: #262625;\n  --accent: #f0a0a3;\n  --warn-bg: #2e2418;\n  --warn-edge: #d99a4e;\n  --body: #2b2b29;\n  --panel: #3b3b37;\n  --panel-door: #31312e;\n  --sign: #e9e8e2;\n  --sign-ink: #111111;\n  --plinth: #4a4944;\n  --housing: #0c0c0b;\n  --screen: #000000;\n  --screen-ink: #cfe0f7;\n  --interior: #202020;\n  --bag: #6b3437;\n  --bag-ink: #ffffff;\n  --zone: rgba(240, 160, 163, 0.09);\n  --hatch: #4a4944;\n  --door-s: #184f95;\n  --door-s-ink: #ffffff;\n  --door-m: #3987e5;\n  --door-m-ink: #0b0b0b;\n  --door-l: #9ec5f4;\n  --door-l-ink: #0b0b0b;\n}\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font: 400 15px/1.55 var(--font-ui);\n  -webkit-font-smoothing: antialiased;\n}\n[hidden] { display: none !important; }\np { margin: 0; }\n.page {\n  max-width: 1120px;\n  margin-inline: auto;\n  padding-inline: 24px;\n  padding-block: 44px 72px;\n  display: grid;\n  gap: 60px;\n}\n.masthead { display: grid; gap: 14px; }\n.eyebrow {\n  font: 600 12px/1.4 var(--font-ui);\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--accent);\n}\nh1 {\n  font: 700 clamp(40px, 7.5vw, 64px)/0.92 var(--font-display);\n  text-transform: uppercase;\n  letter-spacing: 0.005em;\n  margin: 0;\n  text-wrap: balance;\n}\n.lede { max-width: 68ch; color: var(--ink-2); font-size: 16px; }\nh2 { font: 600 30px/1.05 var(--font-display); letter-spacing: 0.005em; margin: 0; text-wrap: balance; }\nh3 { font: 600 15px/1.3 var(--font-ui); margin: 0; }\n.section { display: grid; gap: 18px; }\n.section-head { display: grid; gap: 6px; }\n.note { color: var(--ink-2); max-width: 72ch; }\n.small { font-size: 13px; color: var(--muted); max-width: 80ch; }\na { color: inherit; text-underline-offset: 2px; }\n\n/* Key figures */\n.figures {\n  display: grid;\n  grid-template-columns: repeat(4, minmax(0, 1fr));\n  gap: 20px;\n  margin: 0;\n  padding-top: 24px;\n  border-top: 1px solid var(--line);\n}\n.figure-tile { display: grid; gap: 4px; align-content: start; }\n.figure-tile dt { font-size: 13px; color: var(--ink-2); }\n.figure-tile dd { margin: 0; font: 600 30px/1.1 var(--font-ui); letter-spacing: -0.01em; }\n.figure-tile dd small { display: block; margin-top: 4px; font: 400 13px/1.4 var(--font-ui); color: var(--muted); letter-spacing: 0; }\n\n/* Tables */\n.table-wrap { overflow-x: auto; }\ntable { border-collapse: collapse; width: 100%; font-size: 14px; }\nth, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--grid); vertical-align: top; }\nth { font-size: 13px; font-weight: 600; color: var(--ink-2); }\ntd.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }\ntd.dims { font-variant-numeric: tabular-nums; white-space: nowrap; }\n.sizes td:first-child { white-space: nowrap; }\ntr.total td { font-weight: 600; }\n.size-chip {\n  display: inline-grid;\n  place-items: center;\n  width: 26px;\n  height: 22px;\n  border-radius: 4px;\n  font-weight: 700;\n  font-size: 12px;\n  margin-right: 8px;\n  vertical-align: 1px;\n}\n.chip-s { background: var(--door-s); color: var(--door-s-ink); }\n.chip-m { background: var(--door-m); color: var(--door-m-ink); }\n.chip-l { background: var(--door-l); color: var(--door-l-ink); }\n.chip-c { background: var(--panel); color: var(--ink); }\n\n/* Drawings */\n.sheet {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 18px;\n  display: grid;\n  gap: 14px;\n  min-width: 0;\n}\n.sheet-pair { display: grid; grid-template-columns: minmax(0, 3540fr) minmax(0, 1420fr); gap: 18px; align-items: start; }\nfigure.dwg { margin: 0; display: grid; gap: 10px; min-width: 0; }\n.tb {\n  display: flex;\n  align-items: baseline;\n  gap: 10px;\n  flex-wrap: wrap;\n  padding-bottom: 8px;\n  border-bottom: 1px solid var(--grid);\n}\n.tb-no { font: 700 18px/1 var(--font-display); letter-spacing: 0.04em; color: var(--accent); }\n.tb-name { font-weight: 600; }\n.tb-meta { margin-left: auto; font-size: 12px; color: var(--muted); }\n.dwg-scroll { overflow-x: auto; }\n.dwg-scroll svg { display: block; width: 100%; height: auto; }\n.w-elev svg { min-width: 640px; }\n.w-sect svg { min-width: 280px; max-width: 520px; margin-inline: auto; }\n.w-plan svg { min-width: 600px; }\nfigure.dwg figcaption { font-size: 13px; color: var(--ink-2); max-width: 80ch; }\n.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-2); }\n.legend li { display: inline-flex; align-items: center; gap: 8px; }\n.sw { width: 16px; height: 16px; border-radius: 3px; flex: none; }\n.sw-dash { width: 22px; height: 0; border-top: 2px dashed var(--muted); flex: none; }\n\n.dwg text { font-family: var(--font-ui); }\n.dwg .body { fill: var(--body); }\n.dwg .outline { fill: none; stroke: var(--ink); stroke-width: 8; }\n.dwg .frame { stroke: var(--ink); stroke-width: 4; }\n.dwg .sign { fill: var(--sign); }\n.dwg .sign-t { fill: var(--sign-ink); font-weight: 700; letter-spacing: 6px; }\n.dwg .plinth { fill: var(--plinth); stroke: var(--ink); stroke-width: 4; }\n.dwg .door { stroke: var(--ink); stroke-width: 3; }\n.dwg .door-s { fill: var(--door-s); }\n.dwg .door-m { fill: var(--door-m); }\n.dwg .door-l { fill: var(--door-l); }\n.dwg .door-t-s { fill: var(--door-s-ink); }\n.dwg .door-t-m { fill: var(--door-m-ink); }\n.dwg .door-t-l { fill: var(--door-l-ink); }\n.dwg .b { font-weight: 700; }\n.dwg .panel { fill: var(--panel); }\n.dwg .housing { fill: var(--housing); }\n.dwg .screen { fill: var(--screen); }\n.dwg .screen-t { fill: var(--screen-ink); font-weight: 600; }\n.dwg .plate { fill: var(--surface); stroke: var(--ink); stroke-width: 3; }\n.dwg .qr { fill: var(--ink); }\n.dwg .qr-in { fill: var(--surface); }\n.dwg .service { fill: var(--panel-door); stroke: var(--ink); stroke-width: 3; }\n.dwg .key { fill: var(--ink); }\n.dwg .opt { fill: none; stroke: var(--muted); stroke-width: 5; stroke-dasharray: 30 18; }\n.dwg .floor, .dwg .wall-face { stroke: var(--ink); stroke-width: 8; }\n.dwg .hatch { stroke: var(--hatch); stroke-width: 4; }\n.dwg .dim { stroke: var(--muted); stroke-width: 3; }\n.dwg .tick { stroke-width: 5; }\n.dwg .dim-t { fill: var(--muted); font-variant-numeric: tabular-nums; }\n.dwg .t { fill: var(--ink-2); }\n.dwg .t-strong { fill: var(--ink); font-weight: 600; }\n.dwg .interior { fill: var(--interior); }\n.dwg .bag { fill: var(--bag); stroke: var(--ink); stroke-width: 4; }\n.dwg .bag-t { fill: var(--bag-ink); font-weight: 600; }\n.dwg .bolt { stroke: var(--ink); stroke-width: 12; }\n.dwg .zone { fill: var(--zone); stroke: var(--accent); stroke-width: 4; stroke-dasharray: 24 16; }\n.dwg .leaf { stroke: var(--ink); stroke-width: 6; }\n.dwg .swing { fill: none; stroke: var(--muted); stroke-width: 3; }\n.dwg .swing-opt { fill: none; stroke: var(--muted); stroke-width: 3; stroke-dasharray: 18 14; }\n\n/* Rent */\n.callout {\n  display: grid;\n  gap: 6px;\n  padding: 14px 16px;\n  border-radius: 8px;\n  background: var(--warn-bg);\n  border-left: 4px solid var(--warn-edge);\n  max-width: 80ch;\n}\n.callout strong { font-weight: 600; }\n.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }\n.card {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 18px;\n  display: grid;\n  gap: 10px;\n  min-width: 0;\n}\n.list { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--ink-2); }\n.list strong { color: var(--ink); font-weight: 600; }\n.footer { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 4px; }\n.sources { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }\ncode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; }\n\n@media (max-width: 900px) {\n  .sheet-pair { grid-template-columns: 1fr; }\n  .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .pair { grid-template-columns: 1fr; }\n}\n@media (max-width: 600px) {\n  .page { padding-inline: 16px; padding-block: 28px 56px; gap: 48px; }\n  .sheet, .card { padding: 14px; }\n  .figure-tile dd { font-size: 24px; }\n  th, td { padding-inline: 8px; }\n}\n\u003c/style>\n\n\u003c/head>\n\u003cbody>\n\u003cmain class=\"page\">\n  \u003cheader class=\"masthead\">\n    \u003cp class=\"eyebrow\">Jogger locker kiosk \u00b7 Design proposal 1 \u00b7 26 Sep 2026\u003c/p>\n    \u003ch1>UP Oval Locker Bank\u003c/h1>\n    \u003cp class=\"lede\">A 30-door steel locker bank sized for what joggers carry. It has 6 small doors with phone charging, 21 backpack doors and 3 large doors, plus a control column with the touch screen and QR payment. It stands 2.80 m wide, 0.62 m deep and 1.85 m tall.\u003c/p>\n  \u003c/header>\n\n  \u003cdl class=\"figures\" aria-label=\"Key figures\">\n    \u003cdiv class=\"figure-tile\">\u003cdt>Doors\u003c/dt>\u003cdd>30\u003csmall>6 small \u00b7 21 backpack \u00b7 3 large\u003c/small>\u003c/dd>\u003c/div>\n    \u003cdiv class=\"figure-tile\">\u003cdt>Unit size\u003c/dt>\u003cdd>2.80 \u00d7 0.62 m\u003csmall>1.85 m tall, 1.90 m with a canopy\u003c/small>\u003c/dd>\u003c/div>\n    \u003cdiv class=\"figure-tile\">\u003cdt>Floor space\u003c/dt>\u003cdd>4.9 m\u00b2\u003csmall>1.74 m\u00b2 for the unit plus 1 m clear in front\u003c/small>\u003c/dd>\u003c/div>\n    \u003cdiv class=\"figure-tile\">\u003cdt>Estimated rent\u003c/dt>\u003cdd>\u20b11.9k\u2013\u20b110.2k\u003csmall>a month with VAT; \u20b116.8k if Gyud Food only rents full stalls\u003c/small>\u003c/dd>\u003c/div>\n  \u003c/dl>\n\n  \u003csection class=\"section\" aria-labelledby=\"sizesTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"sizesTitle\">Three door sizes\u003c/h2>\n      \u003cp class=\"note\">Every door is 360 mm wide and 550 mm deep inside, so a 20\u201330 L laptop backpack fits lying flat. Only the height changes. The backpack door is close to a Japanese small coin locker (340 \u00d7 350 \u00d7 570 mm), which is sized for daypacks.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"table-wrap\">\n      \u003ctable class=\"sizes\">\n        \u003cthead>\u003ctr>\u003cth>Size\u003c/th>\u003cth class=\"num\">Doors\u003c/th>\u003cth>Inside, W \u00d7 H \u00d7 D\u003c/th>\u003cth>What fits\u003c/th>\u003cth class=\"num\">Suggested price, 4 h\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>\u003cspan class=\"size-chip chip-s\">S\u003c/span>Small\u003c/td>\u003ctd class=\"num\">6\u003c/td>\u003ctd class=\"dims\">360 \u00d7 140 \u00d7 550 mm\u003c/td>\u003ctd>Phone, wallet, keys, power bank. USB-A and USB-C charging inside.\u003c/td>\u003ctd class=\"num\">\u20b130\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"size-chip chip-m\">M\u003c/span>Backpack\u003c/td>\u003ctd class=\"num\">21\u003c/td>\u003ctd class=\"dims\">360 \u00d7 300 \u00d7 550 mm\u003c/td>\u003ctd>A 20\u201330 L laptop backpack lying flat (up to about 500 \u00d7 330 \u00d7 250 mm), a gym duffel, or a bike helmet.\u003c/td>\u003ctd class=\"num\">\u20b150\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"size-chip chip-l\">L\u003c/span>Large\u003c/td>\u003ctd class=\"num\">3\u003c/td>\u003ctd class=\"dims\">360 \u00d7 620 \u00d7 550 mm\u003c/td>\u003ctd>Two backpacks, a backpack standing up, or a helmet with a bag. Good for friends jogging together.\u003c/td>\u003ctd class=\"num\">\u20b180\u003c/td>\u003c/tr>\n          \u003ctr class=\"total\">\u003ctd>All doors\u003c/td>\u003ctd class=\"num\">30\u003c/td>\u003ctd>\u003c/td>\u003ctd>Average price across the doors\u003c/td>\u003ctd class=\"num\">\u20b149\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n    \u003cp class=\"small\">At these prices the average door earns \u20b149, so the weather page's revenue figures (\u20b150 a rental) still hold. Overstay: charge \u20b110\u2013\u20b120 for each extra hour before the door opens.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"dwgTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"dwgTitle\">Drawings\u003c/h2>\n      \u003cp class=\"note\">Front view and side cut at the same scale. Door numbers run column by column, top to bottom. Smaller doors sit higher and heavier bags go low. All dimensions are in millimetres.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"sheet\">\n      \u003cdiv class=\"sheet-pair\">\n        \u003cfigure class=\"dwg\">\n          \u003cdiv class=\"tb\">\u003cspan class=\"tb-no\">A-01\u003c/span>\u003cspan class=\"tb-name\">Front elevation\u003c/span>\u003cspan class=\"tb-meta\">mm\u003c/span>\u003c/div>\n          \u003cdiv class=\"dwg-scroll w-elev\">\u003csvg viewBox=\"-440 -60 3540 2330\" role=\"img\" aria-label=\"Front elevation of the locker bank: seven 400 mm columns, 2,800 mm wide and 1,850 mm tall. Doors 1 to 10 and 21 to 30 are backpack doors; column 3 holds four small doors, one backpack and one large door; column 5 holds two small and two large doors; the middle column holds the touch screen, QR payment plate and service cabinet.\" xmlns=\"http://www.w3.org/2000/svg\">\u003cdefs>\u003cpattern id=\"hatchA\" width=\"36\" height=\"36\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\">\u003cline x1=\"0\" y1=\"0\" x2=\"0\" y2=\"36\" class=\"hatch\"/>\u003c/pattern>\u003c/defs>\u003crect x=\"-100\" y=\"100\" width=\"3000\" height=\"50\" class=\"opt\"/>\u003ctext x=\"1400\" y=\"76\" font-size=\"52\" text-anchor=\"middle\" class=\"t\">Canopy, outdoor sites only\u003c/text>\u003crect x=\"0\" y=\"150\" width=\"2800\" height= \"810\" font-size=\"54\" text-anchor=\"middle\" class=\"dim-t\" transform=\"rotate(-90 -368 810)\">1,620\u003c/text>\u003c/svg>\u003c/div>\n        \u003cfigcaption>The unit itself covers 2.80 \u00d7 0.62 m = 1.74 m\u00b2. Doors open 360 mm into the walkway, and a person needs room to stand, so plan a clear 1,000 mm strip in front and 100 mm at each side: 3.00 \u00d7 1.62 m = 4.86 m\u00b2. If the only space is a corridor, ask whether the landlord charges for the unit alone or for the strip too. The dashed line 300 mm past the doors is the canopy edge, needed only outdoors.\u003c/figcaption>\n      \u003c/figure>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"rentTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"rentTitle\">Rent at DiliMall and Gyud Food\u003c/h2>\n      \u003cp class=\"note\">Neither place publishes its rates. The figures below come from a 2025 graft complaint over both projects, as reported in the news: DiliMall's basic rent is \u20b11,000 per m\u00b2 a month, and Gyud Food charges \u20b11,875 per m\u00b2, or \u20b115,000 a month for a stall. The Ombudsman later dismissed the complaint, and rates may have changed since. Use them as a starting point and get a written quote.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"table-wrap\">\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Venue and what you rent\u003c/th>\u003cth class=\"num\">Area\u003c/th>\u003cth class=\"num\">Rent\u003c/th>\u003cth class=\"num\">With 12% VAT\u003c/th>\u003cth class=\"num\">Break-even\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>DiliMall, unit only\u003c/td>\u003ctd class=\"num\">1.74 m\u00b2\u003c/td>\u003ctd class=\"num\">\u20b11,736\u003c/td>\u003ctd class=\"num\">\u20b11,944\u003c/td>\u003ctd class=\"num\">3.5\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>DiliMall, unit and clear strip\u003c/td>\u003ctd class=\"num\">4.86 m\u00b2\u003c/td>\u003ctd class=\"num\">\u20b14,860\u003c/td>\u003ctd class=\"num\">\u20b15,443\u003c/td>\u003ctd class=\"num\">5.1\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Gyud Food, unit only\u003c/td>\u003ctd class=\"num\">1.74 m\u00b2\u003c/td>\u003ctd class=\"num\">\u20b13,255\u003c/td>\u003ctd class=\"num\">\u20b13,646\u003c/td>\u003ctd class=\"num\">4.3\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Gyud Food, unit and clear strip\u003c/td>\u003ctd class=\"num\">4.86 m\u00b2\u003c/td>\u003ctd class=\"num\">\u20b19,113\u003c/td>\u003ctd class=\"num\">\u20b110,206\u003c/td>\u003ctd class=\"num\">7.2\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Gyud Food, full stall\u003c/td>\u003ctd class=\"num\">about 8 m\u00b2\u003c/td>\u003ctd class=\"num\">\u20b115,000\u003c/td>\u003ctd class=\"num\">\u20b116,800\u003c/td>\u003ctd class=\"num\">10.2\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n    \u003cp class=\"small\">Break-even is rentals per joggable window, using the weather page's numbers: 573 joggable windows a year, \u20b147 kept per rental after fees and SMS, and \u20b16,000 of other monthly costs. Many leases also ask for about 3 months' advance and 3 months' deposit, which is \u20b111,700 for the smallest option and \u20b1100,800 for a full Gyud stall. Electricity is usually billed on top.\u003c/p>\n\n    \u003cdiv class=\"callout\" role=\"note\">\n      \u003cstrong>Both places open at 7 AM, and your morning peak starts at 5 AM.\u003c/strong>\n      \u003cp>Robinsons Easymart at DiliMall and Gyud Food both run 7 AM to 10 PM. Mornings are 306 of the 573 joggable windows. If nobody can reach the lockers before 7 AM, only about 369 windows stay sellable, and break-even rises by about half (5.1 becomes 7.9 at DiliMall with the clear strip). Ask for a spot on an outside wall, under a roof, that can be reached from 5 AM, with lighting and CCTV.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"pair\">\n      \u003cdiv class=\"card\">\n        \u003ch3>Gyud Food Hub\u003c/h3>\n        \u003cul class=\"list\">\n          \u003cli>\u003cstrong>Where:\u003c/strong> the UP Diliman Food Hub on E. Jacinto St. near University Avenue, across from the College of Fine Arts. Guides put it 5\u201310 minutes' walk from the Oblation, and visitors mention stopping there after running the Oval.\u003c/li>\n          \u003cli>\u003cstrong>Hours:\u003c/strong> 7 AM to 10 PM daily, open-air, with free parking.\u003c/li>\n          \u003cli>\u003cstrong>Rent:\u003c/strong> the highest per m\u00b2. Reports say some vendors backed out over high rent.\u003c/li>\n          \u003cli>\u003cstrong>Fit:\u003c/strong> the right crowd for this idea. It is worth the extra rent only if they will lease a small wall spot by the m\u00b2 with early access.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n      \u003cdiv class=\"card\">\n        \u003ch3>DiliMall\u003c/h3>\n        \u003cul class=\"list\">\n          \u003cli>\u003cstrong>Where:\u003c/strong> the old UP Shopping Center site on Laurel Ave., G. Apacible, Pio Valenzuela and Roces St., near the Parish of the Holy Sacrifice and the UP Infirmary. Walk it from the Oval before deciding.\u003c/li>\n          \u003cli>\u003cstrong>Hours:\u003c/strong> Robinsons Easymart there opens 7 AM to 10 PM. Other tenants vary.\u003c/li>\n          \u003cli>\u003cstrong>Rent:\u003c/strong> about half of Gyud Food's per m\u00b2.\u003c/li>\n          \u003cli>\u003cstrong>Fit:\u003c/strong> cheaper, with chain-store traffic. The mall is controversial with student groups, which may matter for a student-facing brand.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"askTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"askTitle\">Questions for the leasing offices\u003c/h2>\n    \u003c/div>\n    \u003cul class=\"list\">\n      \u003cli>Can I rent just the floor area of a locker unit, about 2 m\u00b2, or only full stalls?\u003c/li>\n      \u003cli>Is the rate per m\u00b2 per month? Does it include VAT and common-area charges?\u003c/li>\n      \u003cli>Can people reach the lockers from 5 AM, or 24 hours? Is there a guard or CCTV at night?\u003c/li>\n      \u003cli>Is there a covered outside wall with a 220 V outlet? Is electricity sub-metered or a flat fee?\u003c/li>\n      \u003cli>Can I bolt the unit to the floor and wall, and put up a sign?\u003c/li>\n      \u003cli>How much advance and deposit, what minimum term, and what yearly increase? Would you take a share of sales instead of fixed rent?\u003c/li>\n      \u003cli>Who handles disputes over lost items, and do I need insurance?\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"buildTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"buildTitle\">Notes for the fabricator\u003c/h2>\n    \u003c/div>\n    \u003cul class=\"list\">\n      \u003cli>\u003cstrong>Steel:\u003c/strong> 0.8 mm (22 gauge) powder-coated shell and shelves; 1.0 mm (20 gauge) doors with a folded stiffener. Use a light color so the inside stays cooler.\u003c/li>\n      \u003cli>\u003cstrong>Locks:\u003c/strong> 12 V electronic cabinet locks with a door-closed sensor. They must stay locked if the power fails. A master override lives inside the service cabinet.\u003c/li>\n      \u003cli>\u003cstrong>Power:\u003c/strong> one 220 V outlet, about 150 W at peak for locks, screen, router, lights and charging. A battery backup rides through brownouts.\u003c/li>\n      \u003cli>\u003cstrong>Air:\u003c/strong> vent slots at the top and bottom of every door and in the back panel, so sweaty clothes do not leave a smell.\u003c/li>\n      \u003cli>\u003cstrong>Charging:\u003c/strong> USB-A and USB-C ports in the 6 small doors.\u003c/li>\n      \u003cli>\u003cstrong>Light:\u003c/strong> an LED strip in the sign band. It is still dark at 5 AM all year round.\u003c/li>\n      \u003cli>\u003cstrong>Security:\u003c/strong> bolt to the floor and tie to the wall, point a CCTV camera at the doors, and raise an alarm if a door is forced.\u003c/li>\n      \u003cli>\u003cstrong>Outdoor sites:\u003c/strong> add the 300 mm canopy with a drip edge, seal the electronics box, and keep the unit out of the afternoon sun.\u003c/li>\n      \u003cli>\u003cstrong>Reach:\u003c/strong> the system should hand out low doors first and use the top row only when the rest are full.\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"nextTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"nextTitle\">Next: system architecture\u003c/h2>\n      \u003cp class=\"note\">How a QR Ph payment reaches the server, how the server opens a door through the lock controller, how the PIN reaches the jogger by SMS, and what happens when the internet or power drops.\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cfooter class=\"footer\">\n    \u003ch3>Sources\u003c/h3>\n    \u003cul class=\"sources\">\n      \u003cli>Rent figures: \u003ca href=\"https://newsinfo.inquirer.net/2155414/up-officials-2-firms-face-raps-over-mall-food-hub\" rel=\"noopener\">Inquirer, UP officials, 2 firms face raps over mall, food hub\u003c/a>; \u003ca href=\"https://phkule.substack.com/p/inside-the-corruption-complaint-against\" rel=\"noopener\">PHKule, Inside the corruption complaint\u003c/a>; \u003ca href=\"https://www.rappler.com/philippines/ombudsman-dismisses-complaints-university-philippines-officials-dilimall/\" rel=\"noopener\">Rappler, Ombudsman dismisses complaints\u003c/a>\u003c/li>\n      \u003cli>DiliMall: \u003ca href=\"https://interaksyon.philstar.com/trends-spotlights/2023/11/30/265913/dilimall-why-up-dilimans-new-shopping-center-is-drawing-flak/\" rel=\"noopener\">Interaksyon\u003c/a>; \u003ca href=\"https://www.tinigngplaridel.net/robinsons-easymart-dilimall/\" rel=\"noopener\">Tinig ng Plaridel\u003c/a>; \u003ca href=\"https://www.robinsonseasymart.com.ph/directory\" rel=\"noopener\">Robinsons Easymart store directory\u003c/a>; \u003ca href=\"https://iskomunidad.upd.edu.ph/index.php/University_Shopping_Center\" rel=\"noopener\">Iskomunidad\u003c/a>\u003c/li>\n      \u003cli>Gyud Food: \u003ca href=\"https://up.edu.ph/up-diliman-food-hub-opens/\" rel=\"noopener\">UP, Diliman Food Hub opens\u003c/a>; \u003ca href=\"https://awesome.blog/2024/02/gyud-food-guide.html\" rel=\"noopener\">Our Awesome Planet guide\u003c/a>; \u003ca href=\"https://wanderlog.com/place/details/6564816/gyud-food-market-at-up-food-hub\" rel=\"noopener\">Wanderlog\u003c/a>; \u003ca href=\"https://www.philippinebeaches.org/where-to-eat-in-up-diliman/\" rel=\"noopener\">Philippine Beach Guide\u003c/a>; \u003ca href=\"https://www.gyudfoodhub.com/spaces-for-lease/\" rel=\"noopener\">Gyud Food Hub, spaces for lease\u003c/a>\u003c/li>\n      \u003cli>Sizes: \u003ca href=\"https://livejapan.com/en/article-a0000274/\" rel=\"noopener\">LIVE JAPAN, coin locker sizes\u003c/a>; \u003ca href=\"https://www.japan-guide.com/e/e2274.html\" rel=\"noopener\">japan-guide.com, luggage\u003c/a>; \u003ca href=\"https://vancharlioutdoor.com/blog/standard-backpack-size-guide-for-everyday-use/\" rel=\"noopener\">backpack size guide\u003c/a>\u003c/li>\n    \u003c/ul>\n    \u003cp>Design proposal 1. Figures are estimates to check with the landlord and a fabricator. Source files: \u003ccode>jogger-locker/design/\u003c/code> on branch \u003ccode>claude/jogger-locker-kiosk-r03nh0\u003c/code>.\u003c/p>\n  \u003c/footer>\n\u003c/main>\n\n\u003c/body>\n\u003c/html>\n"}, "system": {"title": "UP Oval Locker System", "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cbase target=\"_blank\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>UP Oval Locker System\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap\">\n\u003cstyle>\n:root {\n  color-scheme: light;\n  --bg: #f3f4f1;\n  --surface: #fcfcfb;\n  --box: #f0f0eb;\n  --person: #f6e9e9;\n  --ink: #0b0b0b;\n  --ink-2: #52514e;\n  --muted: #6b6a65;\n  --grid: #e1e0d9;\n  --axis: #b3b2aa;\n  --line: rgba(11, 11, 11, 0.1);\n  --track: #ebeae4;\n  --accent: #7b1113;\n  --font-ui: \"Public Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --font-display: \"Barlow Condensed\", \"Arial Narrow\", \"Roboto Condensed\", system-ui, sans-serif;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    color-scheme: dark;\n    --bg: #0f100f;\n    --surface: #1a1a19;\n    --box: #242423;\n    --person: #3a2627;\n    --ink: #ffffff;\n    --ink-2: #c3c2b7;\n    --muted: #a3a29b;\n    --grid: #2c2c2a;\n    --axis: #55544f;\n    --line: rgba(255, 255, 255, 0.1);\n    --track: #262625;\n    --accent: #f0a0a3;\n  }\n}\n:root[data-theme=\"dark\"] {\n  color-scheme: dark;\n  --bg: #0f100f;\n  --surface: #1a1a19;\n  --box: #242423;\n  --person: #3a2627;\n  --ink: #ffffff;\n  --ink-2: #c3c2b7;\n  --muted: #a3a29b;\n  --grid: #2c2c2a;\n  --axis: #55544f;\n  --line: rgba(255, 255, 255, 0.1);\n  --track: #262625;\n  --accent: #f0a0a3;\n}\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font: 400 15px/1.55 var(--font-ui);\n  -webkit-font-smoothing: antialiased;\n}\n[hidden] { display: none !important; }\np { margin: 0; }\na { color: inherit; text-underline-offset: 2px; }\ncode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }\n.page {\n  max-width: 1120px;\n  margin-inline: auto;\n  padding-inline: 24px;\n  padding-block: 44px 72px;\n  display: grid;\n  gap: 60px;\n}\n.masthead { display: grid; gap: 14px; }\n.eyebrow {\n  font: 600 12px/1.4 var(--font-ui);\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--accent);\n}\nh1 {\n  font: 700 clamp(40px, 7.5vw, 64px)/0.92 var(--font-display);\n  text-transform: uppercase;\n  letter-spacing: 0.005em;\n  margin: 0;\n  text-wrap: balance;\n}\n.lede { max-width: 70ch; color: var(--ink-2); font-size: 16px; }\nh2 { font: 600 30px/1.05 var(--font-display); letter-spacing: 0.005em; margin: 0; text-wrap: balance; }\nh3 { font: 600 15px/1.3 var(--font-ui); margin: 0; }\n.section { display: grid; gap: 18px; }\n.section-head { display: grid; gap: 6px; }\n.note { color: var(--ink-2); max-width: 72ch; }\n.small { font-size: 13px; color: var(--muted); max-width: 80ch; }\n\n.decisions {\n  margin: 0;\n  padding: 24px 0 0;\n  border-top: 1px solid var(--line);\n  list-style: none;\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 18px 36px;\n}\n.decisions li { display: grid; gap: 4px; align-content: start; color: var(--ink-2); }\n.decisions strong { color: var(--ink); font-weight: 600; font-size: 15.5px; }\n\n.sheet {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 18px;\n  display: grid;\n  gap: 14px;\n  min-width: 0;\n}\nfigure.dia { margin: 0; display: grid; gap: 12px; min-width: 0; }\n.tb {\n  display: flex;\n  align-items: baseline;\n  gap: 10px;\n  flex-wrap: wrap;\n  padding-bottom: 8px;\n  border-bottom: 1px solid var(--grid);\n}\n.tb-no { font: 700 18px/1 var(--font-display); letter-spacing: 0.04em; color: var(--accent); }\n.tb-name { font-weight: 600; }\n.dia-scroll { overflow-x: auto; }\n.dia-scroll svg { display: block; width: 100%; height: auto; }\n.w-context svg { min-width: 1040px; }\n.w-rent svg { min-width: 900px; }\n.w-open svg { min-width: 760px; }\n.w-states svg { min-width: 900px; }\nfigure.dia figcaption { font-size: 13.5px; color: var(--ink-2); max-width: 82ch; }\n.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-2); }\n.legend li { display: inline-flex; align-items: center; gap: 8px; }\n.key-line { width: 26px; height: 0; border-top: 2px solid var(--ink-2); flex: none; }\n.key-pay { border-top: 3px solid var(--accent); }\n.key-dash { border-top: 2px dashed var(--ink-2); }\n\n.dia text { font-family: var(--font-ui); }\n.dia .zone { fill: none; stroke: var(--axis); stroke-width: 1.5; stroke-dasharray: 7 6; }\n.dia .zone-t { fill: var(--muted); font-weight: 700; letter-spacing: 1.5px; }\n.dia .box { fill: var(--box); stroke: var(--ink); stroke-width: 1.5; }\n.dia .box.key { stroke-width: 3; }\n.dia .box.person { fill: var(--person); }\n.dia .box-t { fill: var(--ink); font-weight: 700; }\n.dia .box-s { fill: var(--ink-2); }\n.dia .ln { fill: none; stroke: var(--ink-2); stroke-width: 1.6; }\n.dia .ln-dash { stroke-dasharray: 6 5; }\n.dia .ln-pay { stroke: var(--accent); stroke-width: 2.4; }\n.dia .ah { fill: var(--ink-2); }\n.dia .ah-pay { fill: var(--accent); }\n.dia .lbl, .dia .lbl-pay, .dia .frame-t {\n  paint-order: stroke;\n  stroke: var(--surface);\n  stroke-width: 5px;\n  stroke-linejoin: round;\n}\n.dia .lbl { fill: var(--ink-2); }\n.dia .lbl-pay { fill: var(--accent); font-weight: 600; }\n.dia .life { stroke: var(--axis); stroke-width: 1.2; stroke-dasharray: 4 5; }\n.dia .hdr { fill: var(--box); stroke: var(--ink); stroke-width: 1.5; }\n.dia .hdr.person { fill: var(--person); }\n.dia .hdr-t { fill: var(--ink); font-weight: 700; }\n.dia .hdr-s { fill: var(--muted); }\n.dia .frame { fill: none; stroke: var(--muted); stroke-width: 1.2; }\n.dia .frame-tab { fill: var(--track); stroke: var(--muted); stroke-width: 1.2; }\n.dia .frame-t { fill: var(--ink); font-weight: 600; }\n.dia .frame-sep { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 5; }\n.dia .state { fill: var(--box); stroke: var(--ink); stroke-width: 1.5; }\n.dia .state.done { stroke-width: 3.5; }\n.dia .dot { fill: var(--ink); }\n\n.table-wrap { overflow-x: auto; }\ntable { border-collapse: collapse; width: 100%; font-size: 14px; }\nth, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--grid); vertical-align: top; }\nth { font-size: 13px; font-weight: 600; color: var(--ink-2); }\ntd.nowrap { white-space: nowrap; }\ntd code { white-space: nowrap; }\ntr.total td { font-weight: 600; }\n.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }\n.card {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 18px;\n  display: grid;\n  gap: 10px;\n  min-width: 0;\n}\n.list { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--ink-2); max-width: 82ch; }\n.list strong { color: var(--ink); font-weight: 600; }\n.steps { margin: 0; padding-left: 22px; display: grid; gap: 14px; color: var(--ink-2); max-width: 82ch; }\n.steps strong { color: var(--ink); font-weight: 600; }\n.footer { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 6px; }\n.sources { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }\n\n@media (max-width: 900px) {\n  .decisions { grid-template-columns: 1fr; }\n  .pair { grid-template-columns: 1fr; }\n}\n@media (max-width: 600px) {\n  .page { padding-inline: 16px; padding-block: 28px 56px; gap: 48px; }\n  .sheet, .card { padding: 14px; }\n  th, td { padding-inline: 8px; }\n}\n\u003c/style>\n\n\u003c/head>\n\u003cbody>\n\u003cmain class=\"page\">\n  \u003cheader class=\"masthead\">\n    \u003cp class=\"eyebrow\">Jogger locker kiosk \u00b7 System architecture 1 \u00b7 26 Sep 2026\u003c/p>\n    \u003ch1>UP Oval Locker System\u003c/h1>\n    \u003cp class=\"lede\">How a jogger rents and opens a locker with no staff on site. A small computer inside the kiosk runs the doors and checks PINs, even with no internet. A cloud app takes QR Ph payments through PayMongo and texts PINs through Semaphore. You watch and fix everything from your phone.\u003c/p>\n  \u003c/header>\n\n  \u003cul class=\"decisions\" aria-label=\"Main decisions\">\n    \u003cli>\u003cstrong>Pay by dynamic QR Ph, never by receipt.\u003c/strong>\u003cspan>PayMongo tells the server when the money arrives, so nobody checks screenshots and a fake receipt opens nothing.\u003c/span>\u003c/li>\n    \u003cli>\u003cstrong>The kiosk opens lockers on its own.\u003c/strong>\u003cspan>It keeps the active rentals and PIN hashes locally, so people get their things back when the internet or server is down. Only renting needs the internet.\u003c/span>\u003c/li>\n    \u003cli>\u003cstrong>Never hold belongings hostage.\u003c/strong>\u003cspan>If the kiosk can't take an overtime payment, it opens the door anyway and records what is owed.\u003c/span>\u003c/li>\n    \u003cli>\u003cstrong>One HTTPS connection, no message broker.\u003c/strong>\u003cspan>The kiosk calls the server and keeps one request open to hear commands within a second. That is one less service to run and pay for. Add MQTT only past about 10 kiosks.\u003c/span>\u003c/li>\n    \u003cli>\u003cstrong>Raspberry Pi, not an Android tablet.\u003c/strong>\u003cspan>It drives the lock boards and the database directly, keeps time through outages, and has no battery to swell in the heat.\u003c/span>\u003c/li>\n    \u003cli>\u003cstrong>Off-the-shelf lock boards.\u003c/strong>\u003cspan>RS485 boards with door sensors are what commercial smart lockers use. An ESP32 with relays is fine for a bench test but harder to keep running for years.\u003c/span>\u003c/li>\n    \u003cli>\u003cstrong>Reuse the stack you already have.\u003c/strong>\u003cspan>Next.js, Prisma and Supabase Postgres, like \u003ccode>platform/\u003c/code> in this repo, hosted on Render in Singapore.\u003c/span>\u003c/li>\n    \u003cli>\u003cstrong>Every remote action leaves a trail.\u003c/strong>\u003cspan>Remote opens, refunds and disabled doors need a reason and go into a log you can check later.\u003c/span>\u003c/li>\n  \u003c/ul>\n\n  \u003csection class=\"section\" aria-labelledby=\"sysTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"sysTitle\">The whole system\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"sheet\">\n      \u003cfigure class=\"dia\">\n        \u003cdiv class=\"tb\">\u003cspan class=\"tb-no\">S-01\u003c/span>\u003cspan class=\"tb-name\">Parts and connections\u003c/span>\u003c/div>\n        \u003cdiv class=\"dia-scroll w-context\">\u003csvg viewBox=\"0 0 1310 720\" role=\"img\" aria-label=\"System parts. At the Oval: a touch screen, a Raspberry Pi kiosk computer that checks PINs and opens doors even offline, RS485 lock boards driving 30 locks with door sensors, a 12 volt UPS and a 4G router. The kiosk reaches a Next.js web app on Render over HTTPS; the web app uses PostgreSQL on Supabase and scheduled jobs. The web app asks PayMongo for QR codes and receives payment webhooks, and sends SMS through Semaphore. The jogger pays PayMongo from their own phone and receives the PIN by SMS.\" xmlns=\"http://www.w3.org/2000/svg\">\u003cdefs>\u003cmarker id=\"c-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"10\" markerHeight=\"10\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" class=\"ah\"/>\u003c/marker>\u003cmarker id=\"c-ahp\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"10\" markerHeight=\"10\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" class=\"ah-pay\"/>\u003c/marker>\u003c/defs>\u003crect x=\"200\" y=\"30\" width=\"410\" height=\"570\" rx=\"14\" class=\"zone\"/>\u003crect x=\"650\" y=\"30\" width=\"310\" height=\"570\" rx=\"14\" class=\"zone\"/>\u003crect x=\"1025\" y=\"30\" width=\"255\" height=\"320\" rx=\"14\" class=\"zone\"/>\u003ctext x=\"216\" y=\"56\" class=\"zone-t\" text-anchor=\"start\" font-size=\"13\">AT THE OVAL\u003c/text>\u003ctext x=\"666\" y=\"56\" class=\"zone-t\" text-anchor=\"start\" font-size=\"13\">CLOUD\u003c/text>\u003ctext x=\"1041\" y=\"56\" class=\"zone-t\" text-anchor=\"start\" font-size=\"13\">OUTSIDE SERVICES\u003c/text>\u003crect x=\"220\" y=\"75\" width=\"170\" height=\"66\" rx=\"8\" class=\"box\"/>\u003ctext x=\"305\" y=\"102.8\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">12 V UPS\u003c/text>\u003ctext x=\"305\" y=\"122.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">signals power loss\u003c/text>\u003crect x=\"420\" y=\"75\" width=\"170\" height=\"66\" rx=\"8\" class=\"box\"/>\u003ctext x=\"505\" y=\"102.8\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">4G router\u003c/text>\u003ctext x=\"505\" y=\"122.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">venue Wi-Fi backup\u003c/text>\u003crect x=\"220\" y=\"185\" width=\"370\" height=\"170\" rx=\"8\" class=\"box key\"/>\u003ctext x=\"405\" y=\"234.8\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">Kiosk computer\u003c/text>\u003ctext x=\"405\" y=\"254.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">Raspberry Pi 5, Python\u003c/text>\u003ctext x=\"405\" y=\"274.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">SQLite: doors, rentals, PIN hashes\u003c/text>\u003ctext x=\"405\" y=\"294.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">Checks PINs and opens doors offline\u003c/text>\u003ctext x=\"405\" y=\"314.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">Queues events until online\u003c/text>\u003crect x=\"220\" y=\"400\" width=\"170\" height=\"66\" rx=\"8\" class=\"box\"/>\u003ctext x=\"305\" y=\"427.8\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">Touch screen\u003c/text>\u003ctext x=\"305\" y=\"447.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">10.1-inch\u003c/text>\u003crect x=\"420\" y=\"400\" width=\"170\" height=\"66\" rx=\"8\" class=\"box\"/>\u003ctext x=\"505\" y=\"427.8\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">Lock boards\u003c/text>\u003ctext x=\"505\" y=\"447.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">RS485, 32 channels\u003c/text>\u003crect x=\"420\" y=\"510\" width=\"170\" height=\"66\" rx=\"8\" class=\"box\"/>\u003ctext x=\"505\" y=\"537.8\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">30 locks\u003c/text>\u003ctext x=\"505\" y=\"557.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">and door sensors\u003c/text>\u003cpath d=\"M305,141 L305,185\" class=\"ln\" marker-end=\"url(#c-ah)\"/>\u003ctext x=\"313\" y=\"168\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">power\u003c/text>\u003cpath d=\"M505,141 L505,185\" class=\"ln\" marker-end=\"url(#c-ah)\" marker-start=\"url(#c-ah)\"/>\u003ctext x=\"513\" y=\"168\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">Ethernet\u003c/text>\u003cpath d=\"M305,355 L305,400\" class=\"ln\" marker-end=\"url(#c-ah)\" marker-start=\"url(#c-ah)\"/>\u003ctext x=\"313\" y=\"383\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">HDMI, USB\u003c/text>\u003cpath d=\"M505,355 L505,400\" class=\"ln\" marker-end=\"url(#c-ah)\" marker-start=\"url(#c-ah)\"/>\u003ctext x=\"513\" y=\"383\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">RS485\u003c/text>\u003cpath d=\"M505,466 L505,510\" class=\"ln\" marker-end=\"url(#c-ah)\" marker-start=\"url(#c-ah)\"/>\u003ctext x=\"513\" y=\"493\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">12 V, sensors\u003c/text>\u003crect x=\"670\" y=\"75\" width=\"270\" height=\"270\" rx=\"8\" class=\"box\"/>\u003ctext x=\"805\" y=\"164.8\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">Web app\u003c/text>\u003ctext x=\"805\" y=\"184.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">Next.js on Render\u003c/text>\u003ctext x=\"805\" y=\"204.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">Kiosk API and command channel\u003c/text>\u003ctext x=\"805\" y=\"224.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">PayMongo webhook\u003c/text>\u003ctext x=\"805\" y=\"244.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">Owner dashboard, remote open\u003c/text>\u003ctext x=\"805\" y=\"264.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">Jogger status page\u003c/text>\u003crect x=\"670\" y=\"385\" width=\"270\" height=\"80\" rx=\"8\" class=\"box\"/>\u003ctext x=\"805\" y=\"419.8\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">PostgreSQL\u003c/text>\u003ctext x=\"805\" y=\"439.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">Supabase, Singapore\u003c/text>\u003crect x=\"670\" y=\"500\" width=\"270\" height=\"80\" rx=\"8\" class=\"box\"/>\u003ctext x=\"805\" y=\"524.8\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">Scheduled jobs\u003c/text>\u003ctext x=\"805\" y=\"544.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">offline checks, reminders,\u003c/text>\u003ctext x=\"805\" y=\"564.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">nightly payment match\u003c/text>\u003cpath d=\"M805,345 L805,385\" class=\"ln\" marker-end=\"url(#c-ah)\" marker-start=\"url(#c-ah)\"/>\u003ctext x=\"813\" y=\"370\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">Prisma\u003c/text>\u003cpath d=\"M805,500 L805,465\" class=\"ln\" marker-end=\"url(#c-ah)\"/>\u003ctext x=\"813\" y=\"488\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">reads, writes\u003c/text>\u003crect x=\"1040\" y=\"75\" width=\"225\" height=\"90\" rx=\"8\" class=\"box\"/>\u003ctext x=\"1152.5\" y=\"104.8\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">PayMongo\u003c/text>\u003ctext x=\"1152.5\" y=\"124.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">QR Ph payments\u003c/text>\u003ctext x=\"1152.5\" y=\"144.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">and refunds\u003c/text>\u003crect x=\"1040\" y=\"225\" width=\"225\" height=\"90\" rx=\"8\" class=\"box\"/>\u003ctext x=\"1152.5\" y=\"254.8\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">Semaphore\u003c/text>\u003ctext x=\"1152.5\" y=\"274.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">SMS: PINs and\u003c/text>\u003ctext x=\"1152.5\" y=\"294.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">owner alerts\u003c/text>\u003cpath d=\"M590,108 L670,108\" class=\"ln\" marker-end=\"url(#c-ah)\" marker-start=\"url(#c-ah)\"/>\u003ctext x=\"630\" y=\"98\" class=\"lbl\" text-anchor=\"middle\" font-size=\"13\">HTTPS, 4G\u003c/text>\u003cpath d=\"M940,100 L1040,100\" class=\"ln ln-pay\" marker-end=\"url(#c-ahp)\"/>\u003ctext x=\"990\" y=\"91\" class=\"lbl-pay\" text-anchor=\"middle\" font-size=\"13\">create QR\u003c/text>\u003cpath d=\"M1040,140 L940,140\" class=\"ln ln-pay\" marker-end=\"url(#c-ahp)\"/>\u003ctext x=\"990\" y=\"160\" class=\"lbl-pay\" text-anchor=\"middle\" font-size=\"13\">webhook\u003c/text>\u003cpath d=\"M940,270 L1040,270\" class=\"ln\" marker-end=\"url(#c-ah)\"/>\u003ctext x=\"990\" y=\"261\" class=\"lbl\" text-anchor=\"middle\" font-size=\"13\">send SMS\u003c/text>\u003crect x=\"10\" y=\"395\" width=\"120\" height=\"80\" rx=\"8\" class=\"box person\"/>\u003ctext x=\"70\" y=\"429.8\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">Jogger\u003c/text>\u003ctext x=\"70\" y=\"449.8\" class=\"box-s\" text-anchor=\"middle\" font-size=\"14\">with a phone\u003c/text>\u003cpath d=\"M130,433 L220,433\" class=\"ln\" marker-end=\"url(#c-ah)\"/>\u003ctext x=\"175\" y=\"424\" class=\"lbl\" text-anchor=\"middle\" font-size=\"13\">rent, PIN\u003c/text>\u003cpath d=\"M55,475 L55,690 L1295,690 L1295,120 L1265,120\" class=\"ln ln-pay\" marker-end=\"url(#c-ahp)\"/>\u003ctext x=\"700\" y=\"682\" class=\"lbl-pay\" text-anchor=\"middle\" font-size=\"13\">pays by scanning the QR in GCash, Maya or a bank app\u003c/text>\u003cpath d=\"M1153,315 L1153,650 L85,650 L85,475\" class=\"ln\" marker-end=\"url(#c-ah)\"/>\u003ctext x=\"700\" y=\"642\" class=\"lbl\" text-anchor=\
