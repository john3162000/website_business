7.5vw, 64px)/0.92 var(--font-display);\n  text-transform: uppercase;\n  letter-spacing: 0.005em;\n  margin: 0;\n  text-wrap: balance;\n}\n.lede { max-width: 72ch; color: var(--ink-2); font-size: 16px; }\nh2 { font: 600 30px/1.05 var(--font-display); letter-spacing: 0.005em; margin: 0; text-wrap: balance; }\n.section { display: grid; gap: 16px; }\n\n.stage { display: grid; gap: 14px; }\n.viewer {\n  position: relative;\n  width: 100%;\n  aspect-ratio: 16 / 10;\n  max-height: 78vh;\n  min-height: 340px;\n  border-radius: 12px;\n  overflow: hidden;\n  background: var(--stage);\n  border: 1px solid var(--line);\n  touch-action: none;\n}\n.viewer canvas { display: block; width: 100%; height: 100%; cursor: grab; }\n.viewer canvas:active { cursor: grabbing; }\n.caption {\n  position: absolute;\n  left: 12px;\n  bottom: 12px;\n  max-width: min(560px, calc(100% - 24px));\n  display: grid;\n  gap: 2px;\n  padding: 10px 14px;\n  border-radius: 10px;\n  background: var(--overlay);\n  border: 1px solid var(--line);\n  pointer-events: none;\n}\n.caption-no { font: 600 12px/1.3 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }\n.caption-text { font-weight: 600; font-size: 15px; }\n.fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-2); }\n.video-title { display: none; }\n\n.controls { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; }\n.group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\n.group-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }\n.btn {\n  font: 600 14px/1 var(--font-ui);\n  padding: 10px 14px;\n  border-radius: 999px;\n  border: 1px solid var(--line);\n  background: var(--surface);\n  color: var(--ink);\n  cursor: pointer;\n}\n.btn:hover { border-color: var(--muted); }\n.btn:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }\n.btn[aria-pressed=\"true\"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }\nselect {\n  font: 500 14px var(--font-ui);\n  padding: 8px 10px;\n  border-radius: 8px;\n  border: 1px solid var(--line);\n  background: var(--surface);\n  color: var(--ink);\n}\n.hint { font-size: 13px; color: var(--muted); }\n\n.steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }\n.steps button {\n  width: 100%;\n  height: 100%;\n  display: grid;\n  gap: 4px;\n  text-align: left;\n  font: 500 14px/1.4 var(--font-ui);\n  color: var(--ink-2);\n  padding: 12px 14px;\n  border-radius: 10px;\n  border: 1px solid var(--line);\n  background: var(--surface);\n  cursor: pointer;\n}\n.steps button:hover { border-color: var(--muted); }\n.steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n.steps button.is-now { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }\n.step-no { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }\n.step-text { color: var(--ink); font-weight: 600; }\n\n.specs { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 36px; }\n.specs div { display: grid; gap: 2px; padding-top: 10px; border-top: 1px solid var(--line); }\n.specs dt { font-size: 13px; color: var(--ink-2); }\n.specs dd { margin: 0; font-weight: 600; }\n.footer { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 4px; }\n\n/* Full-frame layout used when recording the video */\n.video-mode { overflow: hidden; }\n.video-mode .page { display: block; padding: 0; max-width: none; }\n.video-mode .masthead, .video-mode .controls, .video-mode .hint, .video-mode .section, .video-mode .footer { display: none; }\n.video-mode .viewer { position: fixed; left: 0; top: 0; width: 1280px; height: 720px; aspect-ratio: auto; max-height: none; border: 0; border-radius: 0; }\n.video-mode .caption { left: 28px; bottom: 28px; padding: 14px 20px; max-width: 760px; }\n.video-mode .caption-text { font-size: 24px; }\n.video-mode .caption-no { font-size: 15px; }\n.video-mode .video-title {\n  display: block;\n  position: absolute;\n  left: 28px;\n  top: 24px;\n  font: 700 30px/1 var(--font-display);\n  letter-spacing: 0.02em;\n  text-transform: uppercase;\n  color: var(--ink);\n}\n\n@media (max-width: 800px) {\n  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .specs { grid-template-columns: 1fr; }\n}\n@media (max-width: 600px) {\n  .page { padding-inline: 16px; padding-block: 28px 56px; gap: 36px; }\n  .viewer { aspect-ratio: 4 / 5; }\n  .steps { grid-template-columns: 1fr; }\n  .caption-text { font-size: 14px; }\n}\n\u003c/style>\n\n\u003c/head>\n\u003cbody>\n\u003cmain class=\"page\">\n  \u003cheader class=\"masthead\">\n    \u003cp class=\"eyebrow\">Jogger locker kiosk \u00b7 3D model 1 \u00b7 26 Sep 2026\u003c/p>\n    \u003ch1>UP Oval Locker 3D\u003c/h1>\n    \u003cp class=\"lede\">The 30-door locker bank from the drawings, built to the same measurements. Drag to turn it, pinch or scroll to zoom, and tap any door to open it. Press play to watch a jogger pay by QR, leave a backpack in door 15 and collect it after the run.\u003c/p>\n  \u003c/header>\n\n  \u003csection class=\"stage\" aria-label=\"3D model\">\n    \u003cdiv class=\"viewer\" id=\"viewer\">\n      \u003ccanvas id=\"scene\" role=\"img\" aria-label=\"3D model of the 30-door locker bank with its touch-screen control column. Use the buttons below to play the rental, change the view or open doors.\">\u003c/canvas>\n      \u003cp class=\"video-title\">UP Oval Locker \u00b7 a rental\u003c/p>\n      \u003cdiv class=\"caption\" id=\"caption\" aria-live=\"polite\">\n        \u003cspan class=\"caption-no\" id=\"captionNo\">Ready\u003c/span>\n        \u003cspan class=\"caption-text\" id=\"captionText\">Press play to watch a rental at door 15.\u003c/span>\n      \u003c/div>\n      \u003cp class=\"fallback\" id=\"fallback\" hidden>The 3D view could not load. It needs the three.js library from the internet the first time you open it.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"controls\">\n      \u003cdiv class=\"group\">\n        \u003cbutton class=\"btn primary\" type=\"button\" id=\"play\">Play the rental\u003c/button>\n        \u003cbutton class=\"btn\" type=\"button\" id=\"stop\" hidden>Stop\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"group\" role=\"group\" aria-label=\"View\">\n        \u003cspan class=\"group-label\">View\u003c/span>\n        \u003cbutton class=\"btn\" type=\"button\" data-view=\"angle\">Angle\u003c/button>\n        \u003cbutton class=\"btn\" type=\"button\" data-view=\"front\">Front\u003c/button>\n        \u003cbutton class=\"btn\" type=\"button\" data-view=\"side\">Side\u003c/button>\n        \u003cbutton class=\"btn\" type=\"button\" data-view=\"screen\">Screen\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"group\" role=\"group\" aria-label=\"Show\">\n        \u003cspan class=\"group-label\">Show\u003c/span>\n        \u003cbutton class=\"btn\" type=\"button\" id=\"tCanopy\" aria-pressed=\"false\">Canopy\u003c/button>\n        \u003cbutton class=\"btn\" type=\"button\" id=\"tColors\" aria-pressed=\"false\">Size colors\u003c/button>\n        \u003cbutton class=\"btn\" type=\"button\" id=\"tPerson\" aria-pressed=\"true\">Person, 1.60 m\u003c/button>\n        \u003cbutton class=\"btn\" type=\"button\" id=\"tNight\" aria-pressed=\"false\">5 AM light\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"group\" role=\"group\" aria-label=\"Doors\">\n        \u003cspan class=\"group-label\">Doors\u003c/span>\n        \u003cbutton class=\"btn\" type=\"button\" id=\"openAll\">Open all\u003c/button>\n        \u003cbutton class=\"btn\" type=\"button\" id=\"closeAll\">Close all\u003c/button>\n        \u003clabel class=\"sr-only\" for=\"doorPick\">Door number\u003c/label>\n        \u003cselect id=\"doorPick\">\u003c/select>\n        \u003cbutton class=\"btn\" type=\"button\" id=\"doorToggle\">Open or close\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cp class=\"hint\">Drag to turn \u00b7 pinch or scroll to zoom \u00b7 two fingers or right-drag to move \u00b7 tap a door to open or close it\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"stepsTitle\">\n    \u003ch2 id=\"stepsTitle\">The rental, step by step\u003c/h2>\n    \u003col class=\"steps\" id=\"steps\">\u003c/ol>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"specTitle\">\n    \u003ch2 id=\"specTitle\">What's in the model\u003c/h2>\n    \u003cdl class=\"specs\">\n      \u003cdiv>\u003cdt>Size\u003c/dt>\u003cdd>2.80 m wide, 0.62 m deep, 1.85 m tall, in seven 400 mm columns\u003c/dd>\u003c/div>\n      \u003cdiv>\u003cdt>Doors\u003c/dt>\u003cdd>6 small, 21 backpack and 3 large, numbered column by column\u003c/dd>\u003c/div>\n      \u003cdiv>\u003cdt>Control column\u003c/dt>\u003cdd>10-inch touch screen, instruction plate and a locked service cabinet\u003c/dd>\u003c/div>\n      \u003cdiv>\u003cdt>Outdoors\u003c/dt>\u003cdd>Turn on the canopy for a site without a roof; the lit sign band covers 5 AM\u003c/dd>\u003c/div>\n      \u003cdiv>\u003cdt>3D file\u003c/dt>\u003cdd>\u003ccode>up-oval-locker.glb\u003c/code>, openable in 3D viewer apps, with door animations\u003c/dd>\u003c/div>\n      \u003cdiv>\u003cdt>Screen and QR\u003c/dt>\u003cdd>Sample screens and a sample QR code that cannot be paid\u003c/dd>\u003c/div>\n    \u003c/dl>\n  \u003c/section>\n\n  \u003cfooter class=\"footer\">\n    \u003cp>Built with three.js r147 from the same door layout as the UP Oval Locker Bank drawings. Companion pages: UP Oval Locker System and UP Oval Locker Locks.\u003c/p>\n    \u003cp>Source files: \u003ccode>jogger-locker/model/\u003c/code> on branch \u003ccode>claude/jogger-locker-kiosk-r03nh0\u003c/code>.\u003c/p>\n  \u003c/footer>\n\u003c/main>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js\">\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js\">\u003c/script>\n\u003cscript>\n(function () {\n  \"use strict\";\n  const P = {\"module\": 400, \"depth\": 620, \"plinth\": 100, \"doorTop\": 1700, \"signTop\": 1850, \"canopy\": 50, \"canopyReach\": 300, \"pitch\": {\"S\": 160, \"M\": 320, \"L\": 640}, \"columns\": [\"MMMMM\", \"MMMMM\", \"SSSSML\", null, \"SSLL\", \"MMMMM\", \"MMMMM\"]};\n  const viewer = document.getElementById(\"viewer\");\n  const canvas = document.getElementById(\"scene\");\n  const captionNo = document.getElementById(\"captionNo\");\n  const captionText = document.getElementById(\"captionText\");\n  if (!window.THREE || !THREE.OrbitControls) {\n    document.getElementById(\"fallback\").hidden = false;\n    document.getElementById(\"caption\").hidden = true;\n    return;\n  }\n\n  const mm = (v) => v / 1000;\n  const COLS = P.columns;\n  const MOD = mm(P.module), DEPTH = mm(P.depth), PLINTH = mm(P.plinth);\n  const DOOR_TOP = mm(P.doorTop), SIGN_TOP = mm(P.signTop);\n  const WIDTH = MOD * COLS.length, X0 = -WIDTH / 2, T = 0.02;\n  const DEMO = 15;\n  const OPEN_DEG = -100;\n  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();\n  const clamp01 = (v) => Math.min(1, Math.max(0, v));\n  const ease = (v) => (v \u003c 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2);\n  const lerp = (a, b, k) => a + (b - a) * k;\n  const lin = (hex) => new THREE.Color(hex).convertSRGBToLinear();\n  const reduceMotion = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n  const FONT = \"'Public Sans', system-ui, sans-serif\";\n  const FONT_D = \"'Barlow Condensed', 'Arial Narrow', sans-serif\";\n\n  // ---------------------------------------------------------------- renderer\n  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });\n  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));\n  renderer.outputEncoding = THREE.sRGBEncoding;\n  renderer.shadowMap.enabled = true;\n  renderer.shadowMap.type = THREE.PCFSoftShadowMap;\n  const scene = new THREE.Scene();\n  const camera = new THREE.PerspectiveCamera(35, 1.6, 0.05, 60);\n  const controls = new THREE.OrbitControls(camera, canvas);\n  controls.enableDamping = true;\n  controls.dampingFactor = 0.08;\n  controls.minDistance = 0.6;\n  controls.maxDistance = 12;\n  controls.maxPolarAngle = Math.PI * 0.495;\n\n  const hemi = new THREE.HemisphereLight(0xffffff, 0x8f8c84, 0.8);\n  const sun = new THREE.DirectionalLight(0xffffff, 0.85);\n  sun.position.set(2.6, 5.2, 4.2);\n  sun.castShadow = true;\n  const shadowSize = window.innerWidth \u003c 700 ? 1024 : 2048;\n  sun.shadow.mapSize.set(shadowSize, shadowSize);\n  Object.assign(sun.shadow.camera, { left: -3.5, right: 3.5, top: 3.5, bottom: -1.5, near: 0.5, far: 16 });\n  sun.shadow.camera.updateProjectionMatrix();\n  sun.shadow.bias = -0.0004;\n  sun.shadow.normalBias = 0.02;\n  const led = new THREE.SpotLight(0xfff1dc, 0, 5, 1.1, 0.7, 1.4);\n  led.position.set(0, SIGN_TOP - 0.16, 0.35);\n  led.target.position.set(0, 0.4, 0.7);\n  scene.add(hemi, sun, led, led.target);\n\n  const std = (hex, roughness = 0.6, metalness = 0.15) =>\n    new THREE.MeshStandardMaterial({ color: lin(hex), roughness, metalness });\n  const M = {\n    carcass: std(\"#d8d6ce\", 0.5, 0.25),\n    inside: std(\"#8f8e88\", 0.85, 0.05),\n    plinth: std(\"#4a4944\", 0.7, 0.1),\n    panel: std(\"#c8c6be\", 0.55, 0.2),\n    service: std(\"#dad8d1\", 0.5, 0.2),\n    edge: std(\"#c2c0b8\", 0.45, 0.3),\n    housing: std(\"#262624\", 0.5, 0.2),\n    key: std(\"#9a9a96\", 0.3, 0.9),\n    canopy: std(\"#bdbbb3\", 0.5, 0.3),\n    bag: std(\"#1f6f78\", 0.85, 0),\n    bagDark: std(\"#164e55\", 0.85, 0),\n    person: std(\"#a19f97\", 0.9, 0),\n    floor: std(\"#d3d1c9\", 0.95, 0),\n    wall: std(\"#eeeeea\", 0.95, 0),\n  };\n\n  function canvasTexture(w, h) {\n    const c = document.createElement(\"canvas\");\n    c.width = w;\n    c.height = h;\n    const tex = new THREE.CanvasTexture(c);\n    tex.encoding = THREE.sRGBEncoding;\n    tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());\n    return { c, g: c.getContext(\"2d\"), tex };\n  }\n  function roundRect(g, x, y, w, h, r) {\n    g.beginPath();\n    g.moveTo(x + r, y);\n    g.arcTo(x + w, y, x + w, y + h, r);\n    g.arcTo(x + w, y + h, x, y + h, r);\n    g.arcTo(x, y + h, x, y, r);\n    g.arcTo(x, y, x + w, y, r);\n    g.closePath();\n  }\n\n  // ---------------------------------------------------------------- the locker bank\n  const model = new THREE.Group();\n  model.name = \"locker-bank\";\n  scene.add(model);\n  function box(w, h, d, mat, x, y, z, parent) {\n    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);\n    mesh.position.set(x, y, z);\n    mesh.castShadow = true;\n    mesh.receiveShadow = true;\n    (parent || model).add(mesh);\n    return mesh;\n  }\n\n  const zone = DOOR_TOP - PLINTH;\n  box(WIDTH, SIGN_TOP - PLINTH, T, M.inside, 0, PLINTH + (SIGN_TOP - PLINTH) / 2, -DEPTH + T / 2);\n  box(WIDTH - 0.1, PLINTH, DEPTH - 0.05, M.plinth, 0, PLINTH / 2, -DEPTH / 2 - 0.025);\n  for (let k = 0; k \u003c= COLS.length; k++) {\n    const x = X0 + k * MOD + (k === 0 ? T / 2 : k === COLS.length ? -T / 2 : 0);\n    box(T, zone, DEPTH, M.carcass, x, PLINTH + zone / 2, -DEPTH / 2);\n  }\n\n  const sign = canvasTexture(2048, 110);\n  const signMat = new THREE.MeshStandardMaterial({\n    map: sign.tex, emissive: 0xffffff, emissiveMap: sign.tex, emissiveIntensity: 0.3, roughness: 0.4,\n  });\n  const signBox = new THREE.Mesh(new THREE.BoxGeometry(WIDTH, SIGN_TOP - DOOR_TOP, DEPTH),\n    [M.carcass, M.carcass, M.carcass, M. const b = document.createElement(\"button\");\n    b.type = \"button\";\n    const no = document.createElement(\"span\");\n    no.className = \"step-no\";\n    no.textContent = `Step ${i + 1}`;\n    const tx = document.createElement(\"span\");\n    tx.className = \"step-text\";\n    tx.textContent = step.text;\n    b.append(no, tx);\n    b.addEventListener(\"click\", () => {\n      play(step.t);\n      viewer.scrollIntoView({ behavior: \"smooth\", block: \"nearest\" });\n    });\n    li.append(b);\n    stepsList.append(li);\n    stepButtons.push(b);\n  });\n\n  // ---------------------------------------------------------------- tapping doors and buttons\n  const raycaster = new THREE.Raycaster();\n  const ndc = new THREE.Vector2();\n  let down = null;\n  canvas.addEventListener(\"pointerdown\", (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });\n  canvas.addEventListener(\"pointerup\", (e) => {\n    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || performance.now() - down.t > 500) return;\n    const r = canvas.getBoundingClientRect();\n    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);\n    raycaster.setFromCamera(ndc, camera);\n    const hit = raycaster.intersectObjects(doorMeshes, false)[0];\n    if (hit) toggleDoor(hit.object.userData.door);\n  });\n  function toggleDoor(n) {\n    if (playing) stop(true);\n    const d = doors[n - 1];\n    swing(d, d.to === 0 && d.angle > -1 ? OPEN_DEG : 0);\n  }\n  const pick = document.getElementById(\"doorPick\");\n  doors.forEach((d) => {\n    const o = document.createElement(\"option\");\n    o.value = String(d.n);\n    o.textContent = `Door ${d.n} (${d.size})`;\n    pick.append(o);\n  });\n  pick.value = String(DEMO);\n  document.getElementById(\"doorToggle\").addEventListener(\"click\", () => toggleDoor(Number(pick.value)));\n  document.getElementById(\"openAll\").addEventListener(\"click\", () => {\n    if (playing) stop(true);\n <script>
(function () {
  const pages = JSON.parse(document.getElementById("pages").textContent);
  const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
  const ids = tabs.map((t) => t.dataset.page);
  const frames = {};
  // The 3D tab runs a render loop, so it is unloaded when you leave it.
  const HEAVY = "model";

  function syncTheme(frame) {
    try {
      const theme = document.documentElement.getAttribute("data-theme");
      const root = frame.contentDocument && frame.contentDocument.documentElement;
      if (!root) return;
      if (theme) root.setAttribute("data-theme", theme);
      else root.removeAttribute("data-theme");
    } catch (e) {
      // The frame is not reachable; it follows the system theme instead.
    }
  }
  function load(id) {
    if (frames[id]) return;
    const frame = document.createElement("iframe");
    frame.title = pages[id].title;
    frame.addEventListener("load", () => syncTheme(frame));
    frame.srcdoc = pages[id].html;
    document.getElementById("panel-" + id).append(frame);
    frames[id] = frame;
  }
  function unload(id) {
    if (!frames[id]) return;
    frames[id].remove();
    delete frames[id];
  }
  function select(id, focus) {
    if (!ids.includes(id)) id = ids[0];
    for (const t of tabs) {
      const on = t.dataset.page === id;
      t.setAttribute("aria-selected", String(on));
      t.tabIndex = on ? 0 : -1;
      document.getElementById("panel-" + t.dataset.page).hidden = !on;
      if (on) {
        t.scrollIntoView({ block: "nearest", inline: "nearest" });
        if (focus) t.focus();
      }
    }
    if (id !== HEAVY) unload(HEAVY);
    load(id);
    try {
      history.replaceState(null, "", "#" + id);
    } catch (e) {
      // Some viewers do not allow changing the address; the tab still switches.
    }
  }
  tabs.forEach((t, i) => {
    t.addEventListener("click", () => select(t.dataset.page));
    t.addEventListener("keydown", (e) => {
      const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
      let next = null;
      if (step) next = ids[(i + step + ids.length) % ids.length];
      else if (e.key === "Home") next = ids[0];
      else if (e.key === "End") next = ids[ids.length - 1];
      if (next === null) return;
      e.preventDefault();
      select(next, true);
    });
  });
  new MutationObserver(() => Object.values(frames).forEach(syncTheme))
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  window.addEventListener("hashchange", () => select(location.hash.slice(1)));
  select(location.hash.slice(1));
})();
</script>
