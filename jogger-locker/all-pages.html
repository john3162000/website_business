"middle\" font-size=\"13\">SMS with the PIN\u003c/text>\u003c/svg>\u003c/div>\n        \u003cfigcaption>The kiosk computer is the only part that touches the doors. It reaches the server over one HTTPS connection through the 4G router. The maroon lines are the money path: the server asks PayMongo for a QR code, the jogger pays from their own phone, and PayMongo tells the server the payment arrived.\u003c/figcaption>\n      \u003c/figure>\n      \u003cul class=\"legend\" aria-label=\"Legend\">\n        \u003cli>\u003cspan class=\"key-line key-pay\">\u003c/span>Money path\u003c/li>\n        \u003cli>\u003cspan class=\"key-line\">\u003c/span>Data or power\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"rentTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"rentTitle\">Renting a locker\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"sheet\">\n      \u003cfigure class=\"dia\">\n        \u003cdiv class=\"tb\">\u003cspan class=\"tb-no\">S-02\u003c/span>\u003cspan class=\"tb-name\">Rent: from choosing a size to a locked door\u003c/span>\u003c/div>\n        \u003cdiv class=\"dia-scroll w-rent\">\u003csvg viewBox=\"0 0 1150 870\" role=\"img\" aria-label=\"Rent sequence in 17 steps: the jogger picks a size and enters a mobile number; the kiosk asks the server, which holds door 12 and asks PayMongo for a 50 peso QR code; the kiosk shows it; the jogger pays in GCash or a bank app; PayMongo sends payment.paid to the server; the server starts the rental, makes a PIN and commands the kiosk; the kiosk opens door 12 and shows the PIN; the server texts the PIN through Semaphore; the door closes and the kiosk reports it.\" xmlns=\"http://www.w3.org/2000/svg\">\u003cdefs>\u003cmarker id=\"r-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"10\" markerHeight=\"10\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" class=\"ah\"/>\u003c/marker>\u003cmarker id=\"r-ahp\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"10\" markerHeight=\"10\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" class=\"ah-pay\"/>\u003c/marker>\u003c/defs>\u003cline x1=\"100\" y1=\"76\" x2=\"100\" y2=\"866\" class=\"life\"/>\u003crect x=\"19\" y=\"14\" width=\"162\" height=\"62\" rx=\"8\" class=\"hdr person\"/>\u003ctext x=\"100\" y=\"40\" class=\"hdr-t\" text-anchor=\"middle\" font-size=\"16\">Jogger\u003c/text>\u003ctext x=\"100\" y=\"62\" class=\"hdr-s\" text-anchor=\"middle\" font-size=\"13\">with a phone\u003c/text>\u003cline x1=\"290\" y1=\"76\" x2=\"290\" y2=\"866\" class=\"life\"/>\u003crect x=\"209\" y=\"14\" width=\"162\" height=\"62\" rx=\"8\" class=\"hdr\"/>\u003ctext x=\"290\" y=\"40\" class=\"hdr-t\" text-anchor=\"middle\" font-size=\"16\">Kiosk\u003c/text>\u003ctext x=\"290\" y=\"62\" class=\"hdr-s\" text-anchor=\"middle\" font-size=\"13\">screen and Pi\u003c/text>\u003cline x1=\"480\" y1=\"76\" x2=\"480\" y2=\"866\" class=\"life\"/>\u003crect x=\"399\" y=\"14\" width=\"162\" height=\"62\" rx=\"8\" class=\"hdr\"/>\u003ctext x=\"480\" y=\"40\" class=\"hdr-t\" text-anchor=\"middle\" font-size=\"16\">Lock board\u003c/text>\u003ctext x=\"480\" y=\"62\" class=\"hdr-s\" text-anchor=\"middle\" font-size=\"13\">RS485\u003c/text>\u003cline x1=\"670\" y1=\"76\" x2=\"670\" y2=\"866\" class=\"life\"/>\u003crect x=\"589\" y=\"14\" width=\"162\" height=\"62\" rx=\"8\" class=\"hdr\"/>\u003ctext x=\"670\" y=\"40\" class=\"hdr-t\" text-anchor=\"middle\" font-size=\"16\">Server\u003c/text>\u003ctext x=\"670\" y=\"62\" class=\"hdr-s\" text-anchor=\"middle\" font-size=\"13\">Next.js app\u003c/text>\u003cline x1=\"860\" y1=\"76\" x2=\"860\" y2=\"866\" class=\"life\"/>\u003crect x=\"779\" y=\"14\" width=\"162\" height=\"62\" rx=\"8\" class=\"hdr\"/>\u003ctext x=\"860\" y=\"40\" class=\"hdr-t\" text-anchor=\"middle\" font-size=\"16\">PayMongo\u003c/text>\u003ctext x=\"860\" y=\"62\" class=\"hdr-s\" text-anchor=\"middle\" font-size=\"13\">QR Ph\u003c/text>\u003cline x1=\"1050\" y1=\"76\" x2=\"1050\" y2=\"866\" class=\"life\"/>\u003crect x=\"969\" y=\"14\" width=\"162\" height=\"62\" rx=\"8\" class=\"hdr\"/>\u003ctext x=\"1050\" y=\"40\" class=\"hdr-t\" text-anchor=\"middle\" font-size=\"16\">Semaphore\u003c/text>\u003ctext x=\"1050\" y=\"62\" class=\"hdr-s\" text-anchor=\"middle\" font-size=\"13\">SMS\u003c/text>\u003cpath d=\"M106,120 L284,120\" class=\"ln\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"195\" y=\"112\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">1. choose size, enter mobile number\u003c/text>\u003cpath d=\"M296,164 L664,164\" class=\"ln\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"480\" y=\"156\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">2. POST /api/kiosk/rentals\u003c/text>\u003cpath d=\"M670,200 L710,200 L710,224 L676,224\" class=\"ln\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"720\" y=\"217\" class=\"lbl\" text-anchor=\"start\" font-size=\"14\">3. hold lowest free door for 5 min\u003c/text>\u003cpath d=\"M676,258 L854,258\" class=\"ln\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"765\" y=\"250\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">4. create \u20b150 QR Ph payment\u003c/text>\u003cpath d=\"M854,302 L676,302\" class=\"ln ln-dash\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"765\" y=\"294\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">5. QR code\u003c/text>\u003cpath d=\"M664,346 L296,346\" class=\"ln ln-dash\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"480\" y=\"338\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">6. door 12 and the QR\u003c/text>\u003cpath d=\"M284,390 L106,390\" class=\"ln ln-dash\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"195\" y=\"382\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">7. show QR and a 5-minute timer\u003c/text>\u003cpath d=\"M106,434 L854,434\" class=\"ln ln-pay\" marker-end=\"url(#r-ahp)\"/>\u003ctext x=\"480\" y=\"426\" class=\"lbl-pay\" text-anchor=\"middle\" font-size=\"14\">8. scan and pay in GCash or a bank app\u003c/text>\u003cpath d=\"M854,478 L676,478\" class=\"ln ln-pay\" marker-end=\"url(#r-ahp)\"/>\u003ctext x=\"765\" y=\"470\" class=\"lbl-pay\" text-anchor=\"middle\" font-size=\"14\">9. webhook: payment.paid\u003c/text>\u003cpath d=\"M670,514 L710,514 L710,538 L676,538\" class=\"ln\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"720\" y=\"531\" class=\"lbl\" text-anchor=\"start\" font-size=\"14\">10. start rental, make PIN, ends in 4 h\u003c/text>\u003cpath d=\"M664,572 L296,572\" class=\"ln\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"480\" y=\"564\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">11. command: start rental, door 12, PIN\u003c/text>\u003cpath d=\"M296,616 L474,616\" class=\"ln\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"385\" y=\"608\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">12. open door 12\u003c/text>\u003cpath d=\"M284,660 L106,660\" class=\"ln ln-dash\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"195\" y=\"652\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">13. Door 12 is open. PIN 482913\u003c/text>\u003cpath d=\"M676,704 L1044,704\" class=\"ln\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"860\" y=\"696\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">14. send PIN\u003c/text>\u003cpath d=\"M1044,748 L106,748\" class=\"ln ln-dash\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"575\" y=\"740\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">15. SMS: PIN, end time, help number\u003c/text>\u003cpath d=\"M474,792 L296,792\" class=\"ln ln-dash\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"385\" y=\"784\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">16. door 12 closed\u003c/text>\u003cpath d=\"M296,836 L664,836\" class=\"ln\" marker-end=\"url(#r-ah)\"/>\u003ctext x=\"480\" y=\"828\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">17. event: door 12 closed\u003c/text>\u003c/svg>\u003c/div>\n        \u003cfigcaption>The door opens only after PayMongo confirms the payment (step 9). The PIN appears once on screen and once by SMS, and the kiosk keeps only its hash. While the QR is up, the kiosk also checks the rental every 2 seconds, so a late command still opens the door. If nobody pays within 5 minutes, the QR expires and the door is freed.\u003c/figcaption>\n      \u003c/figure>\n      \u003cul class=\"legend\" aria-label=\"Legend\">\n        \u003cli>\u003cspan class=\"key-line\">\u003c/span>Request or command\u003c/li>\n        \u003cli>\u003cspan class=\"key-line key-dash\">\u003c/span>Reply or screen message\u003c/li>\n        \u003cli>\u003cspan class=\"key-line key-pay\">\u003c/span>Money\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"openTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"openTitle\">Getting your things back\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"sheet\">\n      \u003cfigure class=\"dia\">\n        \u003cdiv class=\"tb\">\u003cspan class=\"tb-no\">S-03\u003c/span>\u003cspan class=\"tb-name\">Open: on time, late, and late with no internet\u003c/span>\u003c/div>\n        \u003cdiv class=\"dia-scroll w-open\">\u003csvg viewBox=\"0 0 960 848\" role=\"img\" aria-label=\"Open sequence: the jogger enters door 12 and the PIN and the kiosk checks the PIN hash locally. On time, the kiosk opens the door and reports the rental ended. Late with internet, the kiosk shows a 40 peso overtime fee, gets a QR through the server and PayMongo, and opens after payment.paid. Late without internet, it opens anyway and records the 40 pesos owed.\" xmlns=\"http://www.w3.org/2000/svg\">\u003cdefs>\u003cmarker id=\"o-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"10\" markerHeight=\"10\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" class=\"ah\"/>\u003c/marker>\u003cmarker id=\"o-ahp\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"10\" markerHeight=\"10\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" class=\"ah-pay\"/>\u003c/marker>\u003c/defs>\u003crect x=\"16\" y=\"192\" width=\"928\" height=\"628\" rx=\"6\" class=\"frame\"/>\u003crect x=\"16\" y=\"192\" width=\"77.2\" height=\"26\" rx=\"6\" class=\"frame-tab\"/>\u003ctext x=\"28\" y=\"210\" class=\"frame-t\" text-anchor=\"start\" font-size=\"13\">On time\u003c/text>\u003cline x1=\"16\" y1=\"310\" x2=\"944\" y2=\"310\" class=\"frame-sep\"/>\u003ctext x=\"28\" y=\"328\" class=\"frame-t\" text-anchor=\"start\" font-size=\"13\">Late, kiosk online\u003c/text>\u003cline x1=\"16\" y1=\"692\" x2=\"944\" y2=\"692\" class=\"frame-sep\"/>\u003ctext x=\"28\" y=\"710\" class=\"frame-t\" text-anchor=\"start\" font-size=\"13\">Late, kiosk offline\u003c/text>\u003cline x1=\"100\" y1=\"76\" x2=\"100\" y2=\"844\" class=\"life\"/>\u003crect x=\"19\" y=\"14\" width=\"162\" height=\"62\" rx=\"8\" class=\"hdr person\"/>\u003ctext x=\"100\" y=\"40\" class=\"hdr-t\" text-anchor=\"middle\" font-size=\"16\">Jogger\u003c/text>\u003ctext x=\"100\" y=\"62\" class=\"hdr-s\" text-anchor=\"middle\" font-size=\"13\">with a phone\u003c/text>\u003cline x1=\"290\" y1=\"76\" x2=\"290\" y2=\"844\" class=\"life\"/>\u003crect x=\"209\" y=\"14\" width=\"162\" height=\"62\" rx=\"8\" class=\"hdr\"/>\u003ctext x=\"290\" y=\"40\" class=\"hdr-t\" text-anchor=\"middle\" font-size=\"16\">Kiosk\u003c/text>\u003ctext x=\"290\" y=\"62\" class=\"hdr-s\" text-anchor=\"middle\" font-size=\"13\">screen and Pi\u003c/text>\u003cline x1=\"480\" y1=\"76\" x2=\"480\" y2=\"844\" class=\"life\"/>\u003crect x=\"399\" y=\"14\" width=\"162\" height=\"62\" rx=\"8\" class=\"hdr\"/>\u003ctext x=\"480\" y=\"40\" class=\"hdr-t\" text-anchor=\"middle\" font-size=\"16\">Lock board\u003c/text>\u003ctext x=\"480\" y=\"62\" class=\"hdr-s\" text-anchor=\"middle\" font-size=\"13\">RS485\u003c/text>\u003cline x1=\"670\" y1=\"76\" x2=\"670\" y2=\"844\" class=\"life\"/>\u003crect x=\"589\" y=\"14\" width=\"162\" height=\"62\" rx=\"8\" class=\"hdr\"/>\u003ctext x=\"670\" y=\"40\" class=\"hdr-t\" text-anchor=\"middle\" font-size=\"16\">Server\u003c/text>\u003ctext x=\"670\" y=\"62\" class=\"hdr-s\" text-anchor=\"middle\" font-size=\"13\">Next.js app\u003c/text>\u003cline x1=\"860\" y1=\"76\" x2=\"860\" y2=\"844\" class=\"life\"/>\u003crect x=\"779\" y=\"14\" width=\"162\" height=\"62\" rx=\"8\" class=\"hdr\"/>\u003ctext x=\"860\" y=\"40\" class=\"hdr-t\" text-anchor=\"middle\" font-size=\"16\">PayMongo\u003c/text>\u003ctext x=\"860\" y=\"62\" class=\"hdr-s\" text-anchor=\"middle\" font-size=\"13\">QR Ph\u003c/text>\u003cpath d=\"M106,120 L284,120\" class=\"ln\" marker-end=\"url(#o-ah)\"/>\u003ctext x=\"195\" y=\"112\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">1. door 12 and PIN\u003c/text>\u003cpath d=\"M290,156 L330,156 L330,180 L296,180\" class=\"ln\" marker-end=\"url(#o-ah)\"/>\u003ctext x=\"340\" y=\"173\" class=\"lbl\" text-anchor=\"start\" font-size=\"14\">2. check PIN hash, no internet needed\u003c/text>\u003cpath d=\"M296,244 L474,244\" class=\"ln\" marker-end=\"url(#o-ah)\"/>\u003ctext x=\"385\" y=\"236\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">3. open door 12\u003c/text>\u003cpath d=\"M296,288 L664,288\" class=\"ln\" marker-end=\"url(#o-ah)\"/>\u003ctext x=\"480\" y=\"280\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">4. event: rental ended (queued if offline)\u003c/text>\u003cpath d=\"M284,362 L106,362\" class=\"ln ln-dash\" marker-end=\"url(#o-ah)\"/>\u003ctext x=\"195\" y=\"354\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">5. 1 h 20 min over: \u20b140\u003c/text>\u003cpath d=\"M296,406 L664,406\" class=\"ln\" marker-end=\"url(#o-ah)\"/>\u003ctext x=\"480\" y=\"398\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">6. ask for an overtime QR\u003c/text>\u003cpath d=\"M676,450 L854,450\" class=\"ln\" marker-end=\"url(#o-ah)\"/>\u003ctext x=\"765\" y=\"442\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">7. create \u20b140 QR Ph payment\u003c/text>\u003cpath d=\"M664,494 L296,494\" class=\"ln ln-dash\" marker-end=\"url(#o-ah)\"/>\u003ctext x=\"480\" y=\"486\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">8. QR code\u003c/text>\u003cpath d=\"M106,538 L854,538\" class=\"ln ln-pay\" marker-end=\"url(#o-ahp)\"/>\u003ctext x=\"480\" y=\"530\" class=\"lbl-pay\" text-anchor=\"middle\" font-size=\"14\">9. pay \u20b140\u003c/text>\u003cpath d=\"M854,582 L676,582\" class=\"ln ln-pay\" marker-end=\"url(#o-ahp)\"/>\u003ctext x=\"765\" y=\"574\" class=\"lbl-pay\" text-anchor=\"middle\" font-size=\"14\">10. webhook: payment.paid\u003c/text>\u003cpath d=\"M664,626 L296,626\" class=\"ln\" marker-end=\"url(#o-ah)\"/>\u003ctext x=\"480\" y=\"618\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">11. command: open door 12\u003c/text>\u003cpath d=\"M296,670 L474,670\" class=\"ln\" marker-end=\"url(#o-ah)\"/>\u003ctext x=\"385\" y=\"662\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">12. open door 12\u003c/text>\u003cpath d=\"M296,744 L474,744\" class=\"ln\" marker-end=\"url(#o-ah)\"/>\u003ctext x=\"385\" y=\"736\" class=\"lbl\" text-anchor=\"middle\" font-size=\"14\">13. open door 12 anyway\u003c/text>\u003cpath d=\"M290,780 L330,780 L330,804 L296,804\" class=\"ln\" marker-end=\"url(#o-ah)\"/>\u003ctext x=\"340\" y=\"797\" class=\"lbl\" text-anchor=\"start\" font-size=\"14\">14. record \u20b140 owed, send it later\u003c/text>\u003c/svg>\u003c/div>\n        \u003cfigcaption>The PIN check happens on the kiosk (step 2), so opening works with no internet. Overtime is \u20b120 for each started hour after a 10-minute grace period; \u20b120 is also PayMongo's smallest allowed charge. When the kiosk is offline it opens anyway and sends the amount owed to the server later.\u003c/figcaption>\n      \u003c/figure>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"stateTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"stateTitle\">Rental states\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"sheet\">\n      \u003cfigure class=\"dia\">\n        \u003cdiv class=\"tb\">\u003cspan class=\"tb-no\">S-04\u003c/span>\u003cspan class=\"tb-name\">Every rental moves through these states\u003c/span>\u003c/div>\n        \u003cdiv class=\"dia-scroll w-states\">\u003csvg viewBox=\"0 0 1140 400\" role=\"img\" aria-label=\"Rental states. Holding a door becomes Active when paid, Released if the QR expires or is cancelled. Active becomes Ended when the PIN is entered in time, Late when time runs out, or Refunded if the door would not open. Late becomes Ended when overtime is paid or recorded as owed, or Abandoned if not collected in 24 hours.\" xmlns=\"http://www.w3.org/2000/svg\">\u003cdefs>\u003cmarker id=\"t-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"10\" markerHeight=\"10\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" class=\"ah\"/>\u003c/marker>\u003cmarker id=\"t-ahp\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"10\" markerHeight=\"10\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" class=\"ah-pay\"/>\u003c/marker>\u003c/defs>\u003crect x=\"80\" y=\"120\" width=\"170\" height=\"62\" rx=\"8\" class=\"state\"/>\u003ctext x=\"165\" y=\"146.3\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">Holding a door\u003c/text>\u003ctext x=\"165\" y=\"165.3\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">5 minutes to pay\u003c/text>\u003crect x=\"370\" y=\"120\" width=\"170\" height=\"62\" rx=\"8\" class=\"state\"/>\u003ctext x=\"455\" y=\"146.3\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">Active\u003c/text>\u003ctext x=\"455\" y=\"165.3\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">paid, 4-hour rental\u003c/text>\u003crect x=\"660\" y=\"120\" width=\"170\" height=\"62\" rx=\"8\" class=\"state\"/>\u003ctext x=\"745\" y=\"146.3\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">Late\u003c/text>\u003ctext x=\"745\" y=\"165.3\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">10 min past end time\u003c/text>\u003crect x=\"950\" y=\"120\" width=\"170\" height=\"62\" rx=\"8\" class=\"state done\"/>\u003ctext x=\"1035\" y=\"146.3\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">Ended\u003c/text>\u003ctext x=\"1035\" y=\"165.3\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">things collected\u003c/text>\u003crect x=\"80\" y=\"310\" width=\"170\" height=\"62\" rx=\"8\" class=\"state done\"/>\u003ctext x=\"165\" y=\"336.3\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">Released\u003c/text>\u003ctext x=\"165\" y=\"355.3\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">door freed\u003c/text>\u003crect x=\"370\" y=\"310\" width=\"170\" height=\"62\" rx=\"8\" class=\"state done\"/>\u003ctext x=\"455\" y=\"336.3\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">Refunded\u003c/text>\u003ctext x=\"455\" y=\"355.3\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">money returned\u003c/text>\u003crect x=\"660\" y=\"310\" width=\"170\" height=\"62\" rx=\"8\" class=\"state done\"/>\u003ctext x=\"745\" y=\"336.3\" class=\"box-t\" text-anchor=\"middle\" font-size=\"16\">Abandoned\u003c/text>\u003ctext x=\"745\" y=\"355.3\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">items kept 30 days\u003c/text>\u003ccircle cx=\"40\" cy=\"151\" r=\"9\" class=\"dot\"/>\u003cpath d=\"M49,151 L80,151\" class=\"ln\" marker-end=\"url(#t-ah)\"/>\u003cpath d=\"M250,151 L370,151\" class=\"ln\" marker-end=\"url(#t-ah)\"/>\u003ctext x=\"310\" y=\"141\" class=\"lbl\" text-anchor=\"middle\" font-size=\"13\">paid\u003c/text>\u003cpath d=\"M540,151 L660,151\" class=\"ln\" marker-end=\"url(#t-ah)\"/>\u003ctext x=\"600\" y=\"141\" class=\"lbl\" text-anchor=\"middle\" font-size=\"13\">time runs out\u003c/text>\u003cpath d=\"M830,151 L950,151\" class=\"ln\" marker-end=\"url(#t-ah)\"/>\u003ctext x=\"890\" y=\"141\" class=\"lbl\" text-anchor=\"middle\" font-size=\"13\">overtime paid\u003c/text>\u003ctext x=\"890\" y=\"175\" class=\"lbl\" text-anchor=\"middle\" font-size=\"13\">or owed\u003c/text>\u003cpath d=\"M455,120 L455,70 L1035,70 L1035,120\" class=\"ln\" marker-end=\"url(#t-ah)\"/>\u003ctext x=\"745\" y=\"62\" class=\"lbl\" text-anchor=\"middle\" font-size=\"13\">PIN entered in time\u003c/text>\u003cpath d=\"M165,182 L165,310\" class=\"ln\" marker-end=\"url(#t-ah)\"/>\u003ctext x=\"175\" y=\"240\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">QR expired\u003c/text>\u003ctext x=\"175\" y=\"258\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">or cancelled\u003c/text>\u003cpath d=\"M455,182 L455,310\" class=\"ln\" marker-end=\"url(#t-ah)\"/>\u003ctext x=\"465\" y=\"240\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">door would\u003c/text>\u003ctext x=\"465\" y=\"258\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">not open\u003c/text>\u003cpath d=\"M745,182 L745,310\" class=\"ln\" marker-end=\"url(#t-ah)\"/>\u003ctext x=\"755\" y=\"240\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">not collected\u003c/text>\u003ctext x=\"755\" y=\"258\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">in 24 hours\u003c/text>\u003c/svg>\u003c/div>\n        \u003cfigcaption>A door becomes free again when its rental is Ended or Released and the door sensor reads closed. A Refunded door stays marked faulty until someone checks it. An Abandoned door waits for staff to empty it.\u003c/figcaption>\n      \u003c/figure>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"failTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"failTitle\">When something breaks\u003c/h2>\n      \u003cp class=\"note\">With no staff on site, every failure needs a planned answer. Wherever a row says alert, you get an SMS.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"table-wrap\">\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>What fails\u003c/th>\u003cth>What the jogger sees\u003c/th>\u003cth>What the system does\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>Internet or server down\u003c/td>\u003ctd>\"Renting is paused. Opening your locker still works.\"\u003c/td>\u003ctd>Checks PINs on the kiosk and queues events. The server sends you an alert after 3 minutes without a heartbeat; an outside uptime monitor watches the server itself.\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Power cut\u003c/td>\u003ctd>Nothing, for several hours\u003c/td>\u003ctd>The UPS runs everything; alert sent. Below 20% battery, renting pauses. If the battery runs out, doors stay locked until someone uses the override key.\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Paid, but the door won't open\u003c/td>\u003ctd>\"Door 12 failed. We moved you to door 14.\"\u003c/td>\u003ctd>Tries another free door of the same size. If none is free, refunds through PayMongo, texts the jogger and marks the door faulty; alert sent.\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Door left open\u003c/td>\u003ctd>A beep and \"Please close door 12\"\u003c/td>\u003ctd>Alert after 5 minutes. The rental stays active.\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Door forced open\u003c/td>\u003ctd>\u2014\u003c/td>\u003ctd>Alarm and alert; check the CCTV.\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Forgot the PIN\u003c/td>\u003ctd>\"Resend PIN\" button\u003c/td>\u003ctd>Texts the PIN again to the same number, up to 3 times.\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Dead or lost phone\u003c/td>\u003ctd>Hotline number on the kiosk\u003c/td>\u003ctd>You check the details and the CCTV, then open the door from the dashboard with a logged reason.\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Someone guessing PINs\u003c/td>\u003ctd>Door locked for 15 minutes after 5 wrong tries\u003c/td>\u003ctd>Alert sent.\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Things left over 24 hours\u003c/td>\u003ctd>SMS reminders\u003c/td>\u003ctd>Staff empty the locker, photograph the items and keep them for 30 days.\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Kiosk computer freezes\u003c/td>\u003ctd>Blank screen for about a minute\u003c/td>\u003ctd>A hardware watchdog restarts it. If it is dead, open doors with the override key and swap in the spare memory card.\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Payment confirmation arrives late\u003c/td>\u003ctd>The QR screen keeps waiting\u003c/td>\u003ctd>The kiosk also asks the server directly, and a nightly check matches every PayMongo payment to a rental.\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"partsTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"partsTitle\">Parts and services\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"table-wrap\">\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Choice\u003c/th>\u003cth>Why\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>Kiosk computer\u003c/td>\u003ctd>Raspberry Pi 5 (4 GB) with an NVMe drive or a high-endurance card, plus the RTC battery\u003c/td>\u003ctd>Runs everything offline, keeps the time through outages, no battery to swell\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Screen\u003c/td>\u003ctd>10.1-inch HDMI touch monitor, Chromium in kiosk mode\u003c/td>\u003ctd>Shows only the kiosk app\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Lock control\u003c/td>\u003ctd>12 V RS485 lock boards with door-sensor inputs, 32+ channels, USB-to-RS485 adapter\u003c/td>\u003ctd>The standard parts inside commercial smart lockers\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Locks\u003c/td>\u003ctd>12 V fail-secure cabinet locks with a door switch\u003c/td>\u003ctd>Stay locked without power and report open or closed\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Power\u003c/td>\u003ctd>12 V UPS with a LiFePO4 battery and a mains-lost signal\u003c/td>\u003ctd>About 7 hours from a 20 Ah battery at the kiosk's roughly 35 W; tells the Pi when power drops\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Network\u003c/td>\u003ctd>4G LTE router with a data SIM; venue Wi-Fi as backup\u003c/td>\u003ctd>Doesn't depend on the venue's network\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Kiosk software\u003c/td>\u003ctd>Python: FastAPI, SQLite and pyserial; the screen app in HTML and JavaScript\u003c/td>\u003ctd>Python, which you already use in this repo\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Server\u003c/td>\u003ctd>Next.js 16, Prisma and TypeScript on Render, Singapore region\u003c/td>\u003ctd>The same stack as \u003ccode>platform/\u003c/code>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Database\u003c/td>\u003ctd>PostgreSQL on Supabase, Singapore region\u003c/td>\u003ctd>Already in use in this repo\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Payments\u003c/td>\u003ctd>PayMongo QR Ph\u003c/td>\u003ctd>A single-use code per payment, 1.5% fee, \u20b120 minimum, webhook when paid\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>SMS\u003c/td>\u003ctd>Semaphore\u003c/td>\u003ctd>Philippine networks, \u20b10.50\u2013\u20b10.56 a text; priority route for PINs\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Remote access\u003c/td>\u003ctd>Tailscale\u003c/td>\u003ctd>Reach the kiosk's command line without opening any ports\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Monitoring\u003c/td>\u003ctd>Heartbeat check on the server plus an outside uptime monitor\u003c/td>\u003ctd>An SMS when anything goes quiet\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"dataTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"dataTitle\">What the system stores\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"pair\">\n      \u003cdiv class=\"card\">\n        \u003ch3>Server database (PostgreSQL)\u003c/h3>\n        \u003cdiv class=\"table-wrap\">\n          \u003ctable>\n            \u003cthead>\u003ctr>\u003cth>Table\u003c/th>\u003cth>Main fields\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>\u003ccode>doors\u003c/code>\u003c/td>\u003ctd>number, size, board, channel, enabled\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>\u003ccode>rentals\u003c/code>\u003c/td>\u003ctd>door, size, mobile number, state, PIN hash, held until, started, ends, ended, overtime owed\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>\u003ccode>payments\u003c/code>\u003c/td>\u003ctd>rental, kind (rental or overtime), amount, PayMongo ID, status, paid at\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>\u003ccode>events\u003c/code>\u003c/td>\u003ctd>door, type (opened, closed, forced, wrong PIN, power lost, heartbeat), time, details\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>\u003ccode>messages\u003c/code>\u003c/td>\u003ctd>rental, number, kind (PIN, reminder, alert), delivery status\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>\u003ccode>owner_actions\u003c/code>\u003c/td>\u003ctd>who, action (remote open, refund, disable door), reason, time\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"card\">\n        \u003ch3>Kiosk (SQLite)\u003c/h3>\n        \u003cdiv class=\"table-wrap\">\n          \u003ctable>\n            \u003cthead>\u003ctr>\u003cth>Table\u003c/th>\u003cth>Main fields\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>\u003ccode>doors\u003c/code>\u003c/td>\u003ctd>number, size, board, channel, open or closed, fault\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>\u003ccode>active_rentals\u003c/code>\u003c/td>\u003ctd>rental, door, PIN hash, ends, reopen allowed until\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>\u003ccode>outbox\u003c/code>\u003c/td>\u003ctd>events not yet sent to the server\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>\u003ccode>settings\u003c/code>\u003c/td>\u003ctd>prices, grace time, overtime rate, hotline number\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n        \u003cp class=\"small\">No mobile numbers are stored on the kiosk.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"apiTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"apiTitle\">Kiosk and server API\u003c/h2>\n      \u003cp class=\"note\">Everything goes over HTTPS. The kiosk sends its own secret token with every call.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"table-wrap\">\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Caller\u003c/th>\u003cth>Endpoint\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>Kiosk\u003c/td>\u003ctd>\u003ccode>POST /api/kiosk/rentals\u003c/code>\u003c/td>\u003ctd>Hold a door and get a QR (size, mobile number)\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Kiosk\u003c/td>\u003ctd>\u003ccode>GET /api/kiosk/rentals/{id}\u003c/code>\u003c/td>\u003ctd>Check payment every 2 seconds while the QR is up\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Kiosk\u003c/td>\u003ctd>\u003ccode>POST /api/kiosk/rentals/{id}/cancel\u003c/code>\u003c/td>\u003ctd>Free the held door\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Kiosk\u003c/td>\u003ctd>\u003ccode>POST /api/kiosk/rentals/{id}/overtime\u003c/code>\u003c/td>\u003ctd>Get a QR for an overtime fee\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Kiosk\u003c/td>\u003ctd>\u003ccode>GET /api/kiosk/commands?wait=25\u003c/code>\u003c/td>\u003ctd>Long-poll for commands: start rental, open door, update settings\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Kiosk\u003c/td>\u003ctd>\u003ccode>POST /api/kiosk/commands/{id}/done\u003c/code>\u003c/td>\u003ctd>Report whether a command worked\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Kiosk\u003c/td>\u003ctd>\u003ccode>POST /api/kiosk/events\u003c/code>\u003c/td>\u003ctd>Send queued door, PIN and power events\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Kiosk\u003c/td>\u003ctd>\u003ccode>POST /api/kiosk/heartbeat\u003c/code>\u003c/td>\u003ctd>Every 60 seconds: power, battery, signal, door states\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>PayMongo\u003c/td>\u003ctd>\u003ccode>POST /api/webhooks/paymongo\u003c/code>\u003c/td>\u003ctd>\u003ccode>payment.paid\u003c/code>, \u003ccode>payment.failed\u003c/code>, \u003ccode>qrph.expired\u003c/code>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>You\u003c/td>\u003ctd>\u003ccode>/admin\u003c/code>\u003c/td>\u003ctd>Door grid, rentals, refunds, remote open, alerts\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"secTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"secTitle\">Security and privacy\u003c/h2>\n    \u003c/div>\n    \u003cul class=\"list\">\n      \u003cli>\u003cstrong>Payments:\u003c/strong> only PayMongo's signed webhook, or the server asking PayMongo directly, can mark a rental paid. Each webhook is handled once, even if PayMongo sends it twice.\u003c/li>\n      \u003cli>\u003cstrong>PINs:\u003c/strong> 6 random digits. The server sends a PIN once to the kiosk and once by SMS, and both keep only a salted hash. Five wrong tries lock that door for 15 minutes and alert you.\u003c/li>\n      \u003cli>\u003cstrong>Commands:\u003c/strong> the kiosk has its own secret. Every command is signed and expires after 60 seconds, so a copied or replayed command cannot open a door.\u003c/li>\n      \u003cli>\u003cstrong>Your dashboard:\u003c/strong> a strong password and two-factor login. Every remote open asks for a reason and is logged.\u003c/li>\n      \u003cli>\u003cstrong>The kiosk:\u003c/strong> kiosk mode, a read-only system disk and no open ports. You reach it through Tailscale. The service cabinet has a tamper switch.\u003c/li>\n      \u003cli>\u003cstrong>Secrets:\u003c/strong> database, PayMongo and Semaphore keys live in Render's environment settings, never in the repo.\u003c/li>\n      \u003cli>\u003cstrong>Data Privacy Act of 2012:\u003c/strong> show a short privacy notice at the kiosk, ask consent for the mobile number, delete numbers after 90 days, and never show a full number on screen.\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"costTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"costTitle\">Running costs\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"table-wrap\">\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Per month\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>Server on Render\u003c/td>\u003ctd class=\"nowrap\">about \u20b1400\u003c/td>\u003ctd>US$7 Starter plan, always on for webhooks and the kiosk connection\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Database on Supabase\u003c/td>\u003ctd class=\"nowrap\">\u20b10, later about \u20b11,450\u003c/td>\u003ctd>Free while building; the US$25 Pro plan adds daily backups once real money flows\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>4G data SIM\u003c/td>\u003ctd class=\"nowrap\">\u20b1300\u2013\u20b11,000\u003c/td>\u003ctd>The kiosk alone uses well under 1 GB a month\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Domain name\u003c/td>\u003ctd class=\"nowrap\">about \u20b160\u003c/td>\u003ctd>About \u20b1700 a year\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Tailscale, uptime monitor\u003c/td>\u003ctd class=\"nowrap\">\u20b10\u003c/td>\u003ctd>Free plans\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>SMS\u003c/td>\u003ctd class=\"nowrap\">about \u20b11 a rental\u003c/td>\u003ctd>About \u20b1550 a month at the weather page's 6,560 rentals a year\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>PayMongo\u003c/td>\u003ctd class=\"nowrap\">1.5% of sales\u003c/td>\u003ctd>About \u20b10.75 on a \u20b150 rental\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n    \u003cp class=\"small\">The fixed tech costs come to \u20b1800\u2013\u20b13,000 a month, inside the \u20b16,000 of other monthly costs used on the weather page.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"planTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"planTitle\">Build plan\u003c/h2>\n      \u003cp class=\"note\">Durations are rough guesses for one person working part time.\u003c/p>\n    \u003c/div>\n    \u003col class=\"steps\">\n      \u003cli>\u003cstrong>Bench prototype, 2\u20133 weeks.\u003c/strong> A Pi, the screen, one lock board and 4 locks on a table, with a fake \"paid\" button. Done when renting, opening by PIN and opening with the network unplugged all work.\u003c/li>\n      \u003cli>\u003cstrong>Payments and SMS, 2\u20133 weeks.\u003c/strong> The server on Render, the database, PayMongo in test mode, the webhook and Semaphore. Done when a real \u20b120 QR payment opens a door and the PIN arrives by SMS within 10 seconds.\u003c/li>\n      \u003cli>\u003cstrong>Owner tools, 1\u20132 weeks.\u003c/strong> Door grid, rentals, refunds, remote open with a reason, alerts and a daily summary. Done when you can run a whole day from your phone.\u003c/li>\n      \u003cli>\u003cstrong>Install and test on site, 2\u20134 weeks.\u003c/strong> Wire all 30 doors, the UPS and the 4G router. Test for a week by cycling doors, cutting power and unplugging the network. Then open with someone on site for the first two weekends. Done when a week passes with no manual fixes.\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n\n  \u003cfooter class=\"footer\">\n    \u003ch3>Sources\u003c/h3>\n    \u003cul class=\"sources\">\n      \u003cli>PayMongo: \u003ca href=\"https://docs.paymongo.com/docs/payment-acceptance-qr-ph-api\" rel=\"noopener\">QR Ph API\u003c/a>, \u003ca href=\"https://developers.paymongo.com/docs/statuses-messages-webhook-events\" rel=\"noopener\">webhook events\u003c/a>, \u003ca href=\"https://developers.paymongo.com/reference/the-payment-intent-object\" rel=\"noopener\">Payment Intent (\u20b120 minimum)\u003c/a>, \u003ca href=\"https://www.paymongo.com/products/accept-payments/qr-ph\" rel=\"noopener\">QR Ph pricing\u003c/a>\u003c/li>\n      \u003cli>SMS: \u003ca href=\"https://www.semaphore.co/\" rel=\"noopener\">Semaphore\u003c/a>, \u003ca href=\"https://www.sent.dm/resources/philippines-sms-pricing\" rel=\"noopener\">Philippine SMS pricing comparison\u003c/a>\u003c/li>\n      \u003cli>Message brokers considered: \u003ca href=\"https://www.hivemq.com/blog/hivemq-cloud-serverless-vs-starter-mqtt-iot-or-iiot/\" rel=\"noopener\">HiveMQ Cloud plans\u003c/a>\u003c/li>\n    \u003c/ul>\n    \u003cp>System architecture 1. Companion pages: UP Oval Jogging Weather and UP Oval Locker Bank. Source files: \u003ccode>jogger-locker/architecture/\u003c/code> on branch \u003ccode>claude/jogger-locker-kiosk-r03nh0\u003c/code>.\u003c/p>\n  \u003c/footer>\n\u003c/main>\n\n\u003c/body>\n\u003c/html>\n"}, "locks": {"title": "UP Oval Locker Locks", "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cbase target=\"_blank\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>UP Oval Locker Locks\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap\">\n\u003cstyle>\n:root {\n  color-scheme: light;\n  --bg: #f3f4f1;\n  --surface: #fcfcfb;\n  --box: #f0f0eb;\n  --panel: #f5f5f1;\n  --ink: #0b0b0b;\n  --ink-2: #52514e;\n  --muted: #6b6a65;\n  --grid: #e1e0d9;\n  --axis: #b3b2aa;\n  --line: rgba(11, 11, 11, 0.1);\n  --track: #ebeae4;\n  --accent: #7b1113;\n  --on-accent: #ffffff;\n  --housing: #e4e3dd;\n  --steel: #b8c1cb;\n  --hook: #cdd2d8;\n  --coil: #d9a066;\n  --door: #9a9992;\n  --font-ui: \"Public Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --font-display: \"Barlow Condensed\", \"Arial Narrow\", \"Roboto Condensed\", system-ui, sans-serif;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    color-scheme: dark;\n    --bg: #0f100f;\n    --surface: #1a1a19;\n    --box: #242423;\n    --panel: #20201f;\n    --ink: #ffffff;\n    --ink-2: #c3c2b7;\n    --muted: #a3a29b;\n    --grid: #2c2c2a;\n    --axis: #55544f;\n    --line: rgba(255, 255, 255, 0.1);\n    --track: #262625;\n    --accent: #f0a0a3;\n    --on-accent: #111111;\n    --housing: #2e2e2c;\n    --steel: #5d6875;\n    --hook: #4a525c;\n    --coil: #8a5a2b;\n    --door: #6b6a65;\n  }\n}\n:root[data-theme=\"dark\"] {\n  color-scheme: dark;\n  --bg: #0f100f;\n  --surface: #1a1a19;\n  --box: #242423;\n  --panel: #20201f;\n  --ink: #ffffff;\n  --ink-2: #c3c2b7;\n  --muted: #a3a29b;\n  --grid: #2c2c2a;\n  --axis: #55544f;\n  --line: rgba(255, 255, 255, 0.1);\n  --track: #262625;\n  --accent: #f0a0a3;\n  --on-accent: #111111;\n  --housing: #2e2e2c;\n  --steel: #5d6875;\n  --hook: #4a525c;\n  --coil: #8a5a2b;\n  --door: #6b6a65;\n}\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font: 400 15px/1.55 var(--font-ui);\n  -webkit-font-smoothing: antialiased;\n}\n[hidden] { display: none !important; }\np { margin: 0; }\na { color: inherit; text-underline-offset: 2px; }\n.page {\n  max-width: 1120px;\n  margin-inline: auto;\n  padding-inline: 24px;\n  padding-block: 44px 72px;\n  display: grid;\n  gap: 60px;\n}\n.masthead { display: grid; gap: 14px; }\n.eyebrow {\n  font: 600 12px/1.4 var(--font-ui);\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--accent);\n}\nh1 {\n  font: 700 clamp(40px, 7.5vw, 64px)/0.92 var(--font-display);\n  text-transform: uppercase;\n  letter-spacing: 0.005em;\n  margin: 0;\n  text-wrap: balance;\n}\n.lede { max-width: 70ch; color: var(--ink-2); font-size: 16px; }\nh2 { font: 600 30px/1.05 var(--font-display); letter-spacing: 0.005em; margin: 0; text-wrap: balance; }\nh3 { font: 600 15px/1.3 var(--font-ui); margin: 0; }\n.section { display: grid; gap: 18px; }\n.section-head { display: grid; gap: 6px; }\n.note { color: var(--ink-2); max-width: 72ch; }\n.small { font-size: 13px; color: var(--muted); max-width: 80ch; }\n\n.figures {\n  display: grid;\n  grid-template-columns: repeat(4, minmax(0, 1fr));\n  gap: 20px;\n  margin: 0;\n  padding-top: 24px;\n  border-top: 1px solid var(--line);\n}\n.figure-tile { display: grid; gap: 4px; align-content: start; }\n.figure-tile dt { font-size: 13px; color: var(--ink-2); }\n.figure-tile dd { margin: 0; font: 600 26px/1.15 var(--font-ui); letter-spacing: -0.01em; }\n.figure-tile dd small { display: block; margin-top: 4px; font: 400 13px/1.4 var(--font-ui); color: var(--muted); letter-spacing: 0; }\n\n.sheet {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 18px;\n  display: grid;\n  gap: 14px;\n  min-width: 0;\n}\nfigure.dia { margin: 0; display: grid; gap: 12px; min-width: 0; }\n.tb {\n  display: flex;\n  align-items: baseline;\n  gap: 10px;\n  flex-wrap: wrap;\n  padding-bottom: 8px;\n  border-bottom: 1px solid var(--grid);\n}\n.tb-no { font: 700 18px/1 var(--font-display); letter-spacing: 0.04em; color: var(--accent); }\n.tb-name { font-weight: 600; }\n.dia-scroll { overflow-x: auto; }\n.dia-scroll svg { display: block; width: 100%; height: auto; }\n.w-mech svg { min-width: 940px; }\n.w-wire svg { min-width: 820px; }\nfigure.dia figcaption { font-size: 13.5px; color: var(--ink-2); max-width: 82ch; }\n\n.dia text { font-family: var(--font-ui); }\n.dia .panel { fill: var(--panel); stroke: var(--grid); stroke-width: 1.5; }\n.dia .panel-t { fill: var(--ink); font-weight: 700; }\n.dia .part { fill: var(--ink-2); }\n.dia .readout { fill: var(--ink); font-weight: 600; }\n.dia .housing { fill: var(--housing); }\n.dia .outline { fill: none; stroke: var(--ink); stroke-width: 2.5; }\n.dia .bolt { fill: var(--steel); stroke: var(--ink); stroke-width: 2; }\n.dia .coil { fill: var(--coil); stroke: var(--ink); stroke-width: 2; }\n.dia .coil.on { fill: var(--accent); }\n.dia .coil-t { fill: var(--ink); font-weight: 600; }\n.dia .coil-t.on { fill: var(--on-accent); }\n.dia .hook { fill: var(--hook); stroke: var(--ink); stroke-width: 2; }\n.dia .door { fill: var(--door); stroke: var(--ink); stroke-width: 2; }\n.dia .switch { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }\n.dia .lever { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }\n.dia .spring { fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linejoin: round; }\n.dia .box { fill: var(--box); stroke: var(--ink); stroke-width: 1.5; }\n.dia .box-t { fill: var(--ink); font-weight: 700; }\n.dia .box-s { fill: var(--ink-2); }\n.dia .bus { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }\n.dia .tap { fill: none; stroke: var(--ink); stroke-width: 3.5; }\n.dia .strip { fill: var(--track); stroke: var(--ink); stroke-width: 1.5; }\n.dia .ln { fill: none; stroke: var(--ink-2); stroke-width: 1.6; }\n.dia .ah { fill: var(--ink-2); }\n.dia .lbl {\n  fill: var(--ink-2);\n  paint-order: stroke;\n  stroke: var(--surface);\n  stroke-width: 5px;\n  stroke-linejoin: round;\n}\n\n.table-wrap { overflow-x: auto; }\ntable { border-collapse: collapse; width: 100%; font-size: 14px; }\nth, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--grid); vertical-align: top; }\nth { font-size: 13px; font-weight: 600; color: var(--ink-2); }\ntd.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }\ntr.pick td { background: var(--track); }\ntr.pick td:first-child { font-weight: 600; }\ntr.total td { font-weight: 600; }\n.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }\n.card {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  padding: 18px;\n  display: grid;\n  gap: 10px;\n  min-width: 0;\n}\n.list { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--ink-2); max-width: 82ch; }\n.list strong { color: var(--ink); font-weight: 600; }\n.steps { margin: 0; padding-left: 22px; display: grid; gap: 10px; color: var(--ink-2); max-width: 82ch; }\n.steps strong { color: var(--ink); font-weight: 600; }\n.footer { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 6px; }\n.sources { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }\ncode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }\n\n@media (max-width: 900px) {\n  .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .pair { grid-template-columns: 1fr; }\n}\n@media (max-width: 600px) {\n  .page { padding-inline: 16px; padding-block: 28px 56px; gap: 48px; }\n  .sheet, .card { padding: 14px; }\n  .figure-tile dd { font-size: 22px; }\n  th, td { padding-inline: 8px; }\n}\n\u003c/style>\n\n\u003c/head>\n\u003cbody>\n\u003cmain class=\"page\">\n  \u003cheader class=\"masthead\">\n    \u003cp class=\"eyebrow\">Jogger locker kiosk \u00b7 Lock mechanism 1 \u00b7 26 Sep 2026\u003c/p>\n    \u003ch1>UP Oval Locker Locks\u003c/h1>\n    \u003cp class=\"lede\">Each door gets a 12 V electronic cabinet lock, the same part used in parcel lockers. It stays locked with no power, springs open on a pulse shorter than a second, locks again when the door is pushed shut, and reports whether the door is closed. The lock itself is not smart. The kiosk computer decides when to open it.\u003c/p>\n  \u003c/header>\n\n  \u003cdl class=\"figures\" aria-label=\"Key figures\">\n    \u003cdiv class=\"figure-tile\">\u003cdt>Lock\u003c/dt>\u003cdd>12 V cabinet lock\u003csmall>fail-secure, built-in door switch, key override\u003c/small>\u003c/dd>\u003c/div>\n    \u003cdiv class=\"figure-tile\">\u003cdt>To open\u003c/dt>\u003cdd>Under 1 s\u003csmall>a 0.8\u20132 A pulse; no power at all while locked\u003c/small>\u003c/dd>\u003c/div>\n    \u003cdiv class=\"figure-tile\">\u003cdt>Controller\u003c/dt>\u003cdd>2 \u00d7 24 channels\u003csmall>RS485 lock boards with an open protocol\u003c/small>\u003c/dd>\u003c/div>\n    \u003cdiv class=\"figure-tile\">\u003cdt>Parts budget\u003c/dt>\u003cdd>\u20b112k\u2013\u20b143k\u003csmall>locks, boards and wiring, before shipping and duties\u003c/small>\u003c/dd>\u003c/div>\n  \u003c/dl>\n\n  \u003csection class=\"section\" aria-labelledby=\"howTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"howTitle\">How the lock works\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"sheet\">\n      \u003cfigure class=\"dia\">\n        \u003cdiv class=\"tb\">\u003cspan class=\"tb-no\">L-01\u003c/span>\u003cspan class=\"tb-name\">Pulse to open, push to lock\u003c/span>\u003c/div>\n        \u003cdiv class=\"dia-scroll w-mech\">\u003csvg viewBox=\"0 0 1200 390\" role=\"img\" aria-label=\"How the lock works, in three panels. Locked: a spring holds the bolt in the notch of the door&#x27;s hook, the coil has no power and the door switch reads locked. Opening: a 12 volt pulse through the coil pulls the bolt up and the pop-out spring pushes the door open. Closing: pushing the door slides the hook under the bolt&#x27;s slanted tip until the bolt drops into the notch and the door is locked again without power.\" xmlns=\"http://www.w3.org/2000/svg\">\u003cdefs>\u003cmarker id=\"m-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"10\" markerHeight=\"10\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" class=\"ah\"/>\u003c/marker>\u003c/defs>\u003crect x=\"0\" y=\"0\" width=\"390\" height=\"390\" rx=\"10\" class=\"panel\"/>\u003ctext x=\"195\" y=\"26\" class=\"panel-t\" text-anchor=\"middle\" font-size=\"15\">1. Locked, no power\u003c/text>\u003crect x=\"20\" y=\"60\" width=\"220\" height=\"230\" rx=\"10\" class=\"housing\"/>\u003cpath d=\"M240,224 V60 H20 V290 H240 V262\" class=\"outline\"/>\u003ctext x=\"130\" y=\"52\" class=\"part\" text-anchor=\"middle\" font-size=\"13\">lock body\u003c/text>\u003cpolygon class=\"bolt\" points=\"130,135 160,135 160,222 142,240 130,240\"/>\u003ctext x=\"122\" y=\"190\" class=\"part\" text-anchor=\"end\" font-size=\"13\">bolt\u003c/text>\u003crect x=\"100\" y=\"75\" width=\"90\" height=\"60\" rx=\"6\" class=\"coil\"/>\u003ctext x=\"145\" y=\"110\" class=\"coil-t\" text-anchor=\"middle\" font-size=\"13\">coil\u003c/text>\u003cpath class=\"hook\" d=\"M70,228 H128 V242 H162 V228 H300 V258 H70 Z\"/>\u003ctext x=\"270\" y=\"218\" class=\"part\" text-anchor=\"middle\" font-size=\"13\">hook\u003c/text>\u003crect x=\"300\" y=\"30\" width=\"25\" height=\"300\" rx=\"3\" class=\"door\"/>\u003ctext x=\"312\" y=\"348\" class=\"part\" text-anchor=\"middle\" font-size=\"13\">door\u003c/text>\u003crect x=\"30\" y=\"233\" width=\"22\" height=\"20\" rx=\"3\" class=\"switch\"/>\u003cline x1=\"52\" y1=\"238\" x2=\"70\" y2=\"240\" class=\"lever\"/>\u003ctext x=\"60\" y=\"282\" class=\"part\" text-anchor=\"start\" font-size=\"12\">door switch\u003c/text>\u003cline x1=\"250\" y1=\"295\" x2=\"250\" y2=\"315\" class=\"outline\"/>\u003cpath d=\"M250,305 L255,312 L260,298 L265,312 L270,298 L275,312 L280,298 L285,312 L290,298 L295,312 L300,305\" class=\"spring\"/>\u003ctext x=\"244\" y=\"322\" class=\"part\" text-anchor=\"end\" font-size=\"12\">pop-out spring\u003c/text>\u003ctext x=\"195\" y=\"376\" class=\"readout\" text-anchor=\"middle\" font-size=\"14\">Switch reads: locked\u003c/text>\u003crect x=\"405\" y=\"0\" width=\"390\" height=\"390\" rx=\"10\" class=\"panel\"/>\u003ctext x=\"600\" y=\"26\" class=\"panel-t\" text-anchor=\"middle\" font-size=\"15\">2. A 12 V pulse opens it\u003c/text>\u003crect x=\"425\" y=\"60\" width=\"220\" height=\"230\" rx=\"10\" class=\"housing\"/>\u003cpath d=\"M645,224 V60 H425 V290 H645 V262\" class=\"outline\"/>\u003ctext x=\"535\" y=\"52\" class=\"part\" text-anchor=\"middle\" font-size=\"13\">lock body\u003c/text>\u003cpolygon class=\"bolt\" points=\"535,105 565,105 565,192 547,210 535,210\"/>\u003ctext x=\"527\" y=\"160\" class=\"part\" text-anchor=\"end\" font-size=\"13\">bolt\u003c/text>\u003crect x=\"505\" y=\"75\" width=\"90\" height=\"60\" rx=\"6\" class=\"coil on\"/>\u003ctext x=\"550\" y=\"110\" class=\"coil-t on\" text-anchor=\"middle\" font-size=\"13\">12 V\u003c/text>\u003cpath class=\"hook\" d=\"M520,228 H578 V242 H612 V228 H750 V258 H520 Z\"/>\u003ctext x=\"720\" y=\"218\" class=\"part\" text-anchor=\"middle\" font-size=\"13\">hook\u003c/text>\u003crect x=\"750\" y=\"30\" width=\"25\" height=\"300\" rx=\"3\" class=\"door\"/>\u003ctext x=\"762\" y=\"348\" class=\"part\" text-anchor=\"middle\" font-size=\"13\">door\u003c/text>\u003crect x=\"435\" y=\"233\" width=\"22\" height=\"20\" rx=\"3\" class=\"switch\"/>\u003cline x1=\"457\" y1=\"238\" x2=\"471\" y2=\"226\" class=\"lever\"/>\u003ctext x=\"465\" y=\"282\" class=\"part\" text-anchor=\"start\" font-size=\"12\">door switch\u003c/text>\u003cline x1=\"655\" y1=\"295\" x2=\"655\" y2=\"315\" class=\"outline\"/>\u003cpath d=\"M655,305 L661.786,312 L668.571,298 L675.357,312 L682.143,298 L688.929,312 L695.714,298 L702.5,312 L709.286,298 L716.071,312 L722.857,298 L729.643,312 L736.429,298 L743.214,312 L750,305\" class=\"spring\"/>\u003ctext x=\"649\" y=\"322\" class=\"part\" text-anchor=\"end\" font-size=\"12\">pop-out spring\u003c/text>\u003cpath d=\"M657,196 L697,196\" class=\"ln\" marker-end=\"url(#m-ah)\"/>\u003cpath d=\"M581,212 L581,170\" class=\"ln\" marker-end=\"url(#m-ah)\"/>\u003ctext x=\"600\" y=\"376\" class=\"readout\" text-anchor=\"middle\" font-size=\"14\">12 V for under a second\u003c/text>\u003crect x=\"810\" y=\"0\" width=\"390\" height=\"390\" rx=\"10\" class=\"panel\"/>\u003ctext x=\"1005\" y=\"26\" class=\"panel-t\" text-anchor=\"middle\" font-size=\"15\">3. Push the door shut\u003c/text>\u003crect x=\"830\" y=\"60\" width=\"220\" height=\"230\" rx=\"10\" class=\"housing\"/>\u003cpath d=\"M1050,224 V60 H830 V290 H1050 V262\" class=\"outline\"/>\u003ctext x=\"940\" y=\"52\" class=\"part\" text-anchor=\"middle\" font-size=\"13\">lock body\u003c/text>\u003cpolygon class=\"bolt\" points=\"940,123 970,123 970,210 952,228 940,228\"/>\u003ctext x=\"932\" y=\"178\" class=\"part\" text-anchor=\"end\" font-size=\"13\">bolt\u003c/text>\u003crect x=\"910\" y=\"75\" width=\"90\" height=\"60\" rx=\"6\" class=\"coil\"/>\u003ctext x=\"955\" y=\"110\" class=\"coil-t\" text-anchor=\"middle\" font-size=\"13\">coil\u003c/text>\u003cpath class=\"hook\" d=\"M920,228 H978 V242 H1012 V228 H1150 V258 H920 Z\"/>\u003ctext x=\"1120\" y=\"218\" class=\"part\" text-anchor=\"middle\" font-size=\"13\">hook\u003c/text>\u003crect x=\"1150\" y=\"30\" width=\"25\" height=\"300\" rx=\"3\" class=\"door\"/>\u003ctext x=\"1162\" y=\"348\" class=\"part\" text-anchor=\"middle\" font-size=\"13\">door\u003c/text>\u003crect x=\"840\" y=\"233\" width=\"22\" height=\"20\" rx=\"3\" class=\"switch\"/>\u003cline x1=\"862\" y1=\"238\" x2=\"876\" y2=\"226\" class=\"lever\"/>\u003ctext x=\"870\" y=\"282\" class=\"part\" text-anchor=\"start\" font-size=\"12\">door switch\u003c/text>\u003cline x1=\"1060\" y1=\"295\" x2=\"1060\" y2=\"315\" class=\"outline\"/>\u003cpath d=\"M1060,305 L1066.43,312 L1072.86,298 L1079.29,312 L1085.71,298 L1092.14,312 L1098.57,298 L1105,312 L1111.43,298 L1117.86,312 L1124.29,298 L1130.71,312 L1137.14,298 L1143.57,312 L1150,305\" class=\"spring\"/>\u003ctext x=\"1054\" y=\"322\" class=\"part\" text-anchor=\"end\" font-size=\"12\">pop-out spring\u003c/text>\u003cpath d=\"M1145,196 L1100,196\" class=\"ln\" marker-end=\"url(#m-ah)\"/>\u003ctext x=\"1005\" y=\"376\" class=\"readout\" text-anchor=\"middle\" font-size=\"14\">Relocks by itself, no power\u003c/text>\u003c/svg>\u003c/div>\n        \u003cfigcaption>A spring holds the bolt down in the notch of a steel hook fixed to the door, so the lock needs no power to stay shut. A short 12 V pulse through the coil pulls the bolt up, and a small spring pushes the door open 1\u20132 cm so the jogger sees which door it is. Pushing the door shut slides the hook under the bolt's slanted tip until the bolt drops into the notch again. The switch at the end of the slot tells the kiosk whether the door is locked. Real models use a sliding bolt or a rotating catch, but they all work this way.\u003c/figcaption>\n      \u003c/figure>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"whyTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"whyTitle\">Why this kind of lock\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"table-wrap\">\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Lock type\u003c/th>\u003cth>How it opens\u003c/th>\u003cth>If the power fails\u003c/th>\u003cth>Door sensor\u003c/th>\u003cth>Verdict\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr class=\"pick\">\u003ctd>12 V cabinet lock with feedback\u003c/td>\u003ctd>A short pulse releases a spring latch; pushing the door relocks it\u003c/td>\u003ctd>Stays locked; key or cable override\u003c/td>\u003ctd>Built in\u003c/td>\u003ctd>Use this. It is made for smart lockers and costs US$2\u201316 each.\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Hobby solenoid lock\u003c/td>\u003ctd>Holds its slanted bolt back while powered (about 650 mA)\u003c/td>\u003ctd>Stays locked\u003c/td>\u003ctd>None; add a magnetic reed switch\u003c/td>\u003ctd>Fine for the first bench test. Weaker, and it reports nothing.\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Magnetic lock\u003c/td>\u003ctd>Holds while powered; cutting power releases it\u003c/td>\u003ctd>Every door opens\u003c/td>\u003ctd>Usually none\u003c/td>\u003ctd>No. A power cut would open all 30 lockers.\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Battery keypad or Bluetooth lock\u003c/td>\u003ctd>Each lock checks its own code, card or phone\u003c/td>\u003ctd>Stays locked until its battery dies\u003c/td>\u003ctd>Varies\u003c/td>\u003ctd>No. That is 30 batteries to change, and it is hard to tie to payments.\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Motor-driven latch\u003c/td>\u003ctd>A small motor turns the latch\u003c/td>\u003ctd>Stays locked\u003c/td>\u003ctd>Built in\u003c/td>\u003ctd>Works, but costs more and opens slower, with nothing gained here.\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n    \u003cp class=\"small\">Fail-secure means the lock stays locked without power. That is what you want for belongings: a blackout never opens a door, and the UPS or the terminal strip below still lets you open doors on purpose.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"wireTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"wireTitle\">How the locks are wired\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"sheet\">\n      \u003cfigure class=\"dia\">\n        \u003cdiv class=\"tb\">\u003cspan class=\"tb-no\">L-02\u003c/span>\u003cspan class=\"tb-name\">Power and control for 30 doors\u003c/span>\u003c/div>\n        \u003cdiv class=\"dia-scroll w-wire\">\u003csvg viewBox=\"0 0 1060 460\" role=\"img\" aria-label=\"Wiring: the wall outlet feeds a 12 volt 10 amp power supply and a 12 volt UPS with a LiFePO4 battery. A 12 volt bus powers a 5 volt converter for the Raspberry Pi and both 24-channel lock boards. The Pi talks to lock board 1 through a USB to RS485 adapter, and board 1 passes the RS485 line on to board 2. Board 1 drives doors 1 to 24 and board 2 drives doors 25 to 30, four wires per door, through a terminal strip in the service cabinet.\" xmlns=\"http://www.w3.org/2000/svg\">\u003cdefs>\u003cmarker id=\"w-ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"10\" markerHeight=\"10\" markerUnits=\"userSpaceOnUse\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" class=\"ah\"/>\u003c/marker>\u003c/defs>\u003crect x=\"20\" y=\"30\" width=\"170\" height=\"56\" rx=\"8\" class=\"box\"/>\u003ctext x=\"105\" y=\"53\" class=\"box-t\" text-anchor=\"middle\" font-size=\"15\">Wall outlet\u003c/text>\u003ctext x=\"105\" y=\"72\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">220 V\u003c/text>\u003crect x=\"20\" y=\"130\" width=\"170\" height=\"56\" rx=\"8\" class=\"box\"/>\u003ctext x=\"105\" y=\"153\" class=\"box-t\" text-anchor=\"middle\" font-size=\"15\">Power supply\u003c/text>\u003ctext x=\"105\" y=\"172\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">12 V, 10 A\u003c/text>\u003crect x=\"20\" y=\"230\" width=\"170\" height=\"70\" rx=\"8\" class=\"box\"/>\u003ctext x=\"105\" y=\"260\" class=\"box-t\" text-anchor=\"middle\" font-size=\"15\">12 V UPS\u003c/text>\u003ctext x=\"105\" y=\"279\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">LiFePO4 battery\u003c/text>\u003cpath d=\"M105,86 L105,130\" class=\"ln\" marker-end=\"url(#w-ah)\"/>\u003ctext x=\"113\" y=\"112\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">AC\u003c/text>\u003cpath d=\"M105,186 L105,230\" class=\"ln\" marker-end=\"url(#w-ah)\"/>\u003ctext x=\"113\" y=\"212\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">12 V\u003c/text>\u003cpath d=\"M190,265 H250 V45 H520 V385\" class=\"bus\"/>\u003ctext x=\"385\" y=\"36\" class=\"lbl\" text-anchor=\"middle\" font-size=\"13\">12 V bus\u003c/text>\u003cpath d=\"M375,45 V75\" class=\"tap\"/>\u003cpath d=\"M520,160 H580\" class=\"tap\"/>\u003cpath d=\"M520,330 H580\" class=\"tap\"/>\u003crect x=\"290\" y=\"75\" width=\"170\" height=\"56\" rx=\"8\" class=\"box\"/>\u003ctext x=\"375\" y=\"98\" class=\"box-t\" text-anchor=\"middle\" font-size=\"15\">5 V converter\u003c/text>\u003ctext x=\"375\" y=\"117\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">5 A for the Pi\u003c/text>\u003crect x=\"290\" y=\"165\" width=\"170\" height=\"70\" rx=\"8\" class=\"box\"/>\u003ctext x=\"375\" y=\"195\" class=\"box-t\" text-anchor=\"middle\" font-size=\"15\">Raspberry Pi 5\u003c/text>\u003ctext x=\"375\" y=\"214\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">kiosk software\u003c/text>\u003crect x=\"290\" y=\"275\" width=\"170\" height=\"56\" rx=\"8\" class=\"box\"/>\u003ctext x=\"375\" y=\"298\" class=\"box-t\" text-anchor=\"middle\" font-size=\"15\">USB to RS485\u003c/text>\u003ctext x=\"375\" y=\"317\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">adapter\u003c/text>\u003cpath d=\"M375,131 L375,165\" class=\"ln\" marker-end=\"url(#w-ah)\"/>\u003ctext x=\"383\" y=\"152\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">5 V\u003c/text>\u003cpath d=\"M375,235 L375,275\" class=\"ln\" marker-end=\"url(#w-ah)\" marker-start=\"url(#w-ah)\"/>\u003ctext x=\"383\" y=\"259\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">USB\u003c/text>\u003crect x=\"580\" y=\"130\" width=\"200\" height=\"100\" rx=\"8\" class=\"box\"/>\u003ctext x=\"680\" y=\"165.5\" class=\"box-t\" text-anchor=\"middle\" font-size=\"15\">Lock board 1\u003c/text>\u003ctext x=\"680\" y=\"184.5\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">24 channels\u003c/text>\u003ctext x=\"680\" y=\"203.5\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">address 1\u003c/text>\u003crect x=\"580\" y=\"300\" width=\"200\" height=\"100\" rx=\"8\" class=\"box\"/>\u003ctext x=\"680\" y=\"335.5\" class=\"box-t\" text-anchor=\"middle\" font-size=\"15\">Lock board 2\u003c/text>\u003ctext x=\"680\" y=\"354.5\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">24 channels\u003c/text>\u003ctext x=\"680\" y=\"373.5\" class=\"box-s\" text-anchor=\"middle\" font-size=\"13\">address 2\u003c/text>\u003cpath d=\"M460,303 L490,303 L490,200 L580,200\" class=\"ln\" marker-end=\"url(#w-ah)\" marker-start=\"url(#w-ah)\"/>\u003ctext x=\"482\" y=\"258\" class=\"lbl\" text-anchor=\"end\" font-size=\"13\">RS485\u003c/text>\u003cpath d=\"M680,230 L680,300\" class=\"ln\" marker-end=\"url(#w-ah)\" marker-start=\"url(#w-ah)\"/>\u003ctext x=\"688\" y=\"270\" class=\"lbl\" text-anchor=\"start\" font-size=\"13\">RS485\u003c/text>\u003cpath d=\"M780,150 L860,130\" class=\"ln\" marker-end=\"url(#w-ah)\"/>\u003cpath d=\"M780,170 L860,180\" class=\"ln\" marker-end=\"url(#w-ah)\"/>\u003cpath d=\"M780,210 L860,260\" class=\"ln\" marker-end=\"url(#w-ah)\"/>\u003cpath d=\"M780,320 L860,320\" class=\"ln\" marker-end=\"url(#w-ah)\"/>\u003cpath d=\"M780,380 L860,405\" class=\"ln\" marker-end=\"url(#w-ah)\"/>\u003crect x=\"812\" y=\"105\" width=\"16\" height=\"320\" rx=\"3\" class=\"strip\"/>\u003crect x=\"860\" y=\"110\" width=\"160\" height=\"40\" rx=\"8\" class=\"box\"/>\u003ctext x=\"940\" y=\"134.2\" class=\"box-t\" text-anchor=\"middle\" font-size=\"14\">Door 1\u003c/text>\u003crect x=\"860\" y=\"160\" width=\"160\" height=\"40\" rx=\"8\" class=\"box\"/>\u003ctext x=\"940\" y=\"184.2\" class=\"box-t\" text-anchor=\"middle\" font-size=\"14\">Door 2\u003c/text>\u003crect x=\"860\" y=\"240\" width=\"160\" height=\"40\" rx=\"8\" class=\"box\"/>\u003ctext x=\"940\" y=\"264.2\" class=\"box-t\" text-anchor=\"middle\" font-size=\"14\">Door 24\u003c/text>\u003crect x=\"860\" y=\"300\" width=\"160\" height=\"40\" rx=\"8\" class=\"box\"/>\u003ctext x=\"940\" y=\"324.2\" class=\"box-t\" text-anchor=\"middle\" font-size=\"14\">Door 25\u003c/text>\u003crect x=\"860\" y=\"385\" width=\"160\" height=\"40\" rx=\"8\" class=\"box\"/>\u003ctext x=\"940\" y=\"409.2\" class=\"box-t\" text-anchor=\"middle\" font-size=\"14\">Door 30\u003c/text>\u003ctext x=\"940\" y=\"228\" class=\"lbl\" text-anchor=\"middle\" font-size=\"18\">\u22ee\u003c/text>\u003ctext x=\"940\" y=\"368\" class=\"lbl\" text-anchor=\"middle\" font-size=\"18\">\u22ee\u003c/text>\u003ctext x=\"940\" y=\"96\" class=\"lbl\" text-anchor=\"middle\" font-size=\"13\">4 wires per door\u003c/text>\u003ctext x=\"820\" y=\"446\" class=\"lbl\" text-anchor=\"middle\" font-size=\"13\">terminal strip\u003c/text>\u003c/svg>\u003c/div>\n        \u003cfigcaption>The Pi sends \"open door 12\" over RS485 to the lock board, which switches 12 V to that lock for a fraction of a second and reads every door switch. The two boards share one RS485 cable and are told apart by their address switches. The door's board and channel are stored in the \u003ccode>doors\u003c/code> table. Each lock's four wires pass through a numbered terminal strip in the service cabinet, so you can open any door by hand with a 12 V battery if a board or the Pi dies.\u003c/figcaption>\n      \u003c/figure>\n    \u003c/div>\n    \u003cdiv class=\"table-wrap\">\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Wire at each lock\u003c/th>\u003cth>Goes to\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>Coil +\u003c/td>\u003ctd>12 V from the board\u003c/td>\u003ctd>Power for the coil\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Coil \u2212\u003c/td>\u003ctd>The board's output for that door\u003c/td>\u003ctd>The board connects it to ground for the pulse\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Switch\u003c/td>\u003ctd>The board's input for that door\u003c/td>\u003ctd>Closed means the door is locked\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Switch common\u003c/td>\u003ctd>Board ground\u003c/td>\u003ctd>Return for the switch\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n    \u003cp class=\"small\">Wire colors differ between models; follow the supplier's diagram. The boards open one door at a time, so the 12 V supply only has to cover one pulse of up to 2 A on top of the Pi, screen and router.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"buyTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"buyTitle\">What to buy\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"pair\">\n      \u003cdiv class=\"card\">\n        \u003ch3>Ask the supplier for a lock that has\u003c/h3>\n        \u003cul class=\"list\">\n          \u003cli>12 V DC and \u003cstrong>fail-secure\u003c/strong> operation: locked with no power\u003c/li>\n          \u003cli>Opening on a pulse, and \u003cstrong>relocking by itself\u003c/strong> when the door is pushed shut\u003c/li>\n          \u003cli>A \u003cstrong>built-in feedback switch\u003c/strong> that reports the door or latch state\u003c/li>\n          \u003cli>2 A or less, rated for pulses (some allow up to 5 seconds on)\u003c/li>\n          \u003cli>About 150 kg holding force, in zinc alloy or stainless steel\u003c/li>\n          \u003cli>A \u003cstrong>mechanical override\u003c/strong>, key or pull cable, for emergencies\u003c/li>\n          \u003cli>A stated cycle rating. Sellers quote up to 1,000,000; each door here opens about 450 times a year\u003c/li>\n          \u003cli>A working temperature of 50 \u00b0C or more, since a steel box in the sun gets hot\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n      \u003cdiv class=\"card\">\n        \u003ch3>And a control board that has\u003c/h3>\n        \u003cul class=\"list\">\n          \u003cli>The same supplier as the locks, so voltage, current and feedback match\u003c/li>\n          \u003cli>24 or 48 channels, RS485, and a 12 V input\u003c/li>\n          \u003cli>A \u003cstrong>published command protocol\u003c/strong>, so we can write our own driver\u003c/li>\n          \u003cli>Door-status reading for every channel\u003c/li>\n          \u003cli>Address switches, so two boards can share one cable\u003c/li>\n        \u003c/ul>\n        \u003cp class=\"small\">Order 4 locks and 1 board first. Buy the other 28 locks after the bench test passes.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"table-wrap\">\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth class=\"num\">Qty\u003c/th>\u003cth class=\"num\">Each\u003c/th>\u003cth class=\"num\">Total\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>12 V cabinet lock with feedback and override (2 spares)\u003c/td>\u003ctd class=\"num\">32\u003c/td>\u003ctd class=\"num\">US$2\u201316\u003c/td>\u003ctd class=\"num\">\u20b13,600\u2013\u20b129,200\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>24-channel RS485 lock board, open protocol\u003c/td>\u003ctd class=\"num\">2\u003c/td>\u003ctd class=\"num\">US$48\u201370\u003c/td>\u003ctd class=\"num\">\u20b15,500\u2013\u20b18,000\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>USB-to-RS485 adapter, terminal strips, wire, fuses (estimate)\u003c/td>\u003ctd class=\"num\">1 set\u003c/td>\u003ctd class=\"num\">\u2014\u003c/td>\u003ctd class=\"num\">\u20b12,000\u2013\u20b14,000\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>12 V 10 A power supply (estimate)\u003c/td>\u003ctd class=\"num\">1\u003c/td>\u003ctd class=\"num\">\u2014\u003c/td>\u003ctd class=\"num\">\u20b11,000\u2013\u20b12,000\u003c/td>\u003c/tr>\n          \u003ctr class=\"total\">\u003ctd>Total\u003c/td>\u003ctd class=\"num\">\u003c/td>\u003ctd class=\"num\">\u003c/td>\u003ctd class=\"num\">\u20b112,000\u2013\u20b143,000\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n    \u003cp class=\"small\">Supplier listing prices converted at \u20b157 to the US dollar, before shipping and import duties. The battery backup is counted with the kiosk power on the architecture page.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"safeTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"safeTitle\">Emergencies and security\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"pair\">\n      \u003cdiv class=\"card\">\n        \u003ch3>Getting a door open when something fails\u003c/h3>\n        \u003cul class=\"list\">\n          \u003cli>\u003cstrong>Power cut:\u003c/strong> nothing changes. The locks draw power only while opening, so the UPS keeps them working for hours.\u003c/li>\n          \u003cli>\u003cstrong>Pi or board dead:\u003c/strong> at the terminal strip, touch a 12 V battery to that door's coil terminals for under a second.\u003c/li>\n          \u003cli>\u003cstrong>Lock jammed:\u003c/strong> use its key or pull-cable override from inside the service cabinet.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n      \u003cdiv class=\"card\">\n        \u003ch3>Keeping it hard to break into\u003c/h3>\n        \u003cul class=\"list\">\n          \u003cli>Lock and wires sit inside the steel frame; nothing is reachable from the front.\u003c/li>\n          \u003cli>A folded lip on each door covers the gap where a screwdriver would go.\u003c/li>\n          \u003cli>The switch reports every opening. A door that opens without a command sets off an alarm.\u003c/li>\n          \u003cli>Five wrong PINs lock that door for 15 minutes (see the architecture page).\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"section\" aria-labelledby=\"testTitle\">\n    \u003cdiv class=\"section-head\">\n      \u003ch2 id=\"testTitle\">Bench test before buying 30\u003c/h2>\n      \u003cp class=\"note\">If you want to start with parts you already know, an ESP32 can drive the first 4 locks. Use a logic-level MOSFET or relay per lock and a diode across each coil. Common driver chips such as the ULN2803 cannot handle 2 A. For 30 doors, switch to the RS485 boards.\u003c/p>\n    \u003c/div>\n    \u003col class=\"steps\">\n      \u003cli>\u003cstrong>Cycle test:\u003c/strong> open and relock each lock 1,000 times with a script. The switch must match every time.\u003c/li>\n      \u003cli>\u003cstrong>Heat test:\u003c/strong> run the cycle test with the unit in the afternoon sun.\u003c/li>\n      \u003cli>\u003cstrong>Power test:\u003c/strong> pull the plug during a rental. The doors must stay locked, run on the UPS, and open by battery at the terminal strip.\u003c/li>\n      \u003cli>\u003cstrong>Pry test:\u003c/strong> try a flat screwdriver at every door gap.\u003c/li>\n      \u003cli>\u003cstrong>Coil test:\u003c/strong> hold one lock open for 5 seconds and check that it does not overheat. The software should never hold it that long.\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n\n  \u003cfooter class=\"footer\">\n    \u003ch3>Sources\u003c/h3>\n    \u003cul class=\"sources\">\n      \u003cli>Lock specs: \u003ca href=\"https://www.electronicpro.co.za/products/k02-12v-dc-2a-electric-magnetic-lock-intelligent-cabinet-door-lock-fail-secure-with-feedback-signal\" rel=\"noopener\">K02 12 V 2 A fail-secure cabinet lock with feedback\u003c/a>; \u003ca href=\"https://learn.escaperoomtechs.com/cabinet-mag-lock/\" rel=\"noopener\">Escape Room Techs, pulsing a cabinet lock\u003c/a>; \u003ca href=\"https://eboxlock.en.made-in-china.com/product/LKCEXDeHZTci/China-Electric-Cabinet-Lock-with-Reporting-for-Smart-Electronic-Lockers-MA1208S-.html\" rel=\"noopener\">electric cabinet lock with reporting\u003c/a>\u003c/li>\n      \u003cli>Prices: \u003ca href=\"https://eboxlock.en.made-in-china.com/product-group/JbPnplVHOUhN/Electric-Cabinet-Lock-catalog-1.html\" rel=\"noopener\">cabinet lock listings\u003c/a>; \u003ca href=\"https://eboxlock.en.made-in-china.com/product/kFhTcSwgEHpY/China-CE-Certified-24CH-Smart-Locker-Controller-with-RS485-for-Parcel-Delivery-Locker-System.html\" rel=\"noopener\">24-channel RS485 locker controller\u003c/a>; \u003ca href=\"https://www.eboxlock.com/Products/Smart-locker-controller.htm\" rel=\"noopener\">controller with open protocol\u003c/a>\u003c/li>\n      \u003cli>Control boards: \u003ca href=\"https://www.kerong.hk/locker-control-board\" rel=\"noopener\">Kerong locker control board\u003c/a>, \u003ca href=\"https://www.kerongtech.com/electric-locker-solution/locker-system-solution/locker-control-board-kr-cu8\" rel=\"noopener\">KR-CU boards\u003c/a>\u003c/li>\n      \u003cli>Local hobby parts: \u003ca href=\"https://www.makerlab.ph/products/12v-solenoid-lock\" rel=\"noopener\">Makerlab 12 V solenoid lock\u003c/a>, \u003ca href=\"https://www.lazada.com.ph/products/solenoid-lock-12vdc-i109883946.html\" rel=\"noopener\">Lazada 12 V solenoid lock\u003c/a>\u003c/li>\n    \u003c/ul>\n    \u003cp>Lock mechanism 1. Companion pages: UP Oval Locker Bank and UP Oval Locker System. Source files: \u003ccode>jogger-locker/locks/\u003c/code> on branch \u003ccode>claude/jogger-locker-kiosk-r03nh0\u003c/code>.\u003c/p>\n  \u003c/footer>\n\u003c/main>\n\n\u003c/body>\n\u003c/html>\n"}, "model": {"title": "UP Oval Locker 3D", "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cbase target=\"_blank\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>UP Oval Locker 3D\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap\">\n\u003cstyle>\n:root {\n  color-scheme: light;\n  --bg: #f3f4f1;\n  --surface: #fcfcfb;\n  --ink: #0b0b0b;\n  --ink-2: #52514e;\n  --muted: #6b6a65;\n  --grid: #e1e0d9;\n  --line: rgba(11, 11, 11, 0.12);\n  --accent: #7b1113;\n  --on-accent: #ffffff;\n  --overlay: rgba(252, 252, 251, 0.92);\n  --stage: #e7e8e3;\n  --floor: #d3d1c9;\n  --wall: #eeeeea;\n  --font-ui: \"Public Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --font-display: \"Barlow Condensed\", \"Arial Narrow\", \"Roboto Condensed\", system-ui, sans-serif;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    color-scheme: dark;\n    --bg: #0f100f;\n    --surface: #1a1a19;\n    --ink: #ffffff;\n    --ink-2: #c3c2b7;\n    --muted: #a3a29b;\n    --grid: #2c2c2a;\n    --line: rgba(255, 255, 255, 0.14);\n    --accent: #f0a0a3;\n    --on-accent: #111111;\n    --overlay: rgba(26, 26, 25, 0.9);\n    --stage: #1b1c1e;\n    --floor: #2b2b29;\n    --wall: #222326;\n  }\n}\n:root[data-theme=\"dark\"] {\n  color-scheme: dark;\n  --bg: #0f100f;\n  --surface: #1a1a19;\n  --ink: #ffffff;\n  --ink-2: #c3c2b7;\n  --muted: #a3a29b;\n  --grid: #2c2c2a;\n  --line: rgba(255, 255, 255, 0.14);\n  --accent: #f0a0a3;\n  --on-accent: #111111;\n  --overlay: rgba(26, 26, 25, 0.9);\n  --stage: #1b1c1e;\n  --floor: #2b2b29;\n  --wall: #222326;\n}\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font: 400 15px/1.55 var(--font-ui);\n  -webkit-font-smoothing: antialiased;\n}\n[hidden] { display: none !important; }\n.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\np { margin: 0; }\na { color: inherit; text-underline-offset: 2px; }\ncode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }\n.page {\n  max-width: 1180px;\n  margin-inline: auto;\n  padding-inline: 24px;\n  padding-block: 40px 72px;\n  display: grid;\n  gap: 48px;\n}\n.masthead { display: grid; gap: 14px; }\n.eyebrow {\n  font: 600 12px/1.4 var(--font-ui);\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--accent);\n}\nh1 {\n  font: 700 clamp(40px,
