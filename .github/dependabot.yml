# Weekly update PRs for the backend's npm packages and the CI actions.
# Each PR runs the required test check before it can merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /scraper-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /site-css
    schedule:
      interval: monthly
    # Stay on Tailwind v3: v4 changes the generated CSS (and the site's look).
    ignore:
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
