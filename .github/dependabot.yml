# Weekly update PRs for the backend's npm packages and the CI actions.
# Each PR runs the required test check before it can merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /scraper-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
