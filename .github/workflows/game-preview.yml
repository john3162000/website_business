name: Game preview

# Phone screenshots of the "Laro" tab for review; commits them to demo/game-out
# on the same branch. Never runs on main.
on:
  push:
    branches-ignore: [main]
    paths: [docs/games.js, docs/taste.js, demo/preview-game.mjs, .github/workflows/game-preview.yml]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: demo
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the site
        run: |
          python3 -m http.server 5173 --directory docs &
          sleep 2
      - name: Capture
        working-directory: demo
        run: node preview-game.mjs http://localhost:5173/ game-out | tee game-out/log.txt
      - name: Make an MP4
        if: always()
        working-directory: demo/game-out
        run: |
          if [ -f game.webm ]; then
            sudo apt-get install -y ffmpeg >/dev/null
            ffmpeg -y -loglevel error -i game.webm -c:v libx264 -pix_fmt yuv420p -movflags +faststart game.mp4
          fi
      - name: Commit the preview
        if: always()
        run: |
          rm -rf demo/node_modules demo/package.json demo/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add demo/game-out
          git commit -m "Add game preview [skip ci]" || echo "nothing to commit"
          git push
