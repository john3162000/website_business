name: Tests

# Gate for auto-merge: main deploys straight to Vercel (backend) and GitHub
# Pages (docs/), so a PR merges only once this passes.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scraper-backend/package-lock.json
      # postinstall runs `prisma generate`, which needs no database.
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Site scripts parse
        run: node --check ../docs/app.js && node --check ../docs/weather.js && node --check ../docs/mydish.js && node --check ../docs/planner.js && node --check ../docs/finder.js
      - name: Site tests
        run: node --test ../docs/*.test.mjs
