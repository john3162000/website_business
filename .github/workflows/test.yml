name: Tests

# Gate for auto-merge: main deploys straight to Vercel (backend) and GitHub
# Pages (docs/), so a PR merges only once this passes.
on:
  pull_request:
  push:
    branches: [main]

# Tests only read the code.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper-backend
    steps:
      # Actions are pinned to full commit SHAs (a moved tag can't change what runs);
      # Dependabot keeps the pins and the version comments up to date.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scraper-backend/package-lock.json
      # postinstall runs `prisma generate`, which needs no database.
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Site scripts parse
        run: for f in ../docs/*.js; do node --check "$f" || exit 1; done
      - name: Site tests
        run: node --test ../docs/*.test.mjs
      # docs/tailwind.css is built from site-css/ (it replaced the Tailwind Play CDN).
      # Rebuild it here and fail if the committed file is stale, e.g. a new class in docs/.
      - name: Site CSS is up to date
        working-directory: site-css
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../docs/tailwind.css || { echo "::error::docs/tailwind.css is stale: run 'cd site-css && npm run build' and commit it"; exit 1; }
