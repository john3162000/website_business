name: DA diagnose

# Temporary: checks why the DA daily prices stopped at Oct 15. Never runs on main.
on:
  push:
    branches-ignore: [main]
    paths: [.github/workflows/da-diagnose.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Latest date in our API
        run: |
          curl -s https://website-business-beta.vercel.app/api/commodities | python3 -c "import sys,json; d=json.load(sys.stdin); print({k:(v if not isinstance(v,list) else len(v)) for k,v in d.items()} if isinstance(d,dict) else len(d))" || true
      - name: Daily Price Index links on the DA page
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sL -A "$UA" -o page.html -w "page status %{http_code}, %{size_download} bytes\n" https://www.da.gov.ph/price-monitoring/
          grep -oiE 'href="[^"]*\.pdf"' page.html | grep -i "price-index\|daily" | head -25
          echo "--- any October 2026 PDFs ---"
          grep -oiE 'href="[^"]*2026/10/[^"]*\.pdf"' page.html | head -40
      - name: Constructed URLs for Oct 15-17
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for d in 15 16 17; do
            u="https://www.da.gov.ph/wp-content/uploads/2026/10/Daily-Price-Index-October-$d-2026.pdf"
            curl -sI -A "$UA" -o /dev/null -w "$d: %{http_code} %{content_type}\n" "$u"
          done
