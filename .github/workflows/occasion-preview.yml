name: Occasion preview

# Temporary: screenshots of the holiday picks in Browse. Never runs on main.
on:
  push:
    branches: [claude/holiday-picks]
    paths: [docs/**, demo/preview-occasions.mjs, .github/workflows/occasion-preview.yml]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: demo
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture
        working-directory: demo
        run: |
          mkdir -p occ-out
          python3 -m http.server 5173 --directory ../docs &
          sleep 2
          node preview-occasions.mjs http://localhost:5173/ 2>&1 | tee occ-out/log.txt
      - name: Commit the preview
        if: always()
        run: |
          rm -rf demo/node_modules demo/package.json demo/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add demo/occ-out
          git commit -m "Add occasion preview [skip ci]" || echo "nothing to commit"
          git pull --rebase && git push
