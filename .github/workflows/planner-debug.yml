name: Planner debug

# Temporary: loads the LIVE site and reports Planner errors. Never runs on main.
on:
  push:
    branches: [claude/planner-debug]
    paths: [demo/planner-debug.mjs, .github/workflows/planner-debug.yml]

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: demo
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check the live Planner
        working-directory: demo
        run: |
          mkdir -p debug-out
          node planner-debug.mjs 2>&1 | tee debug-out/log.txt
      - name: Commit the results
        if: always()
        run: |
          rm -rf demo/node_modules demo/package.json demo/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add demo/debug-out
          git commit -m "Planner debug results [skip ci]" || echo "nothing to commit"
          git pull --rebase && git push
