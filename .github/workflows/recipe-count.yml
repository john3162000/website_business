name: Recipe count

# Temporary: counts live recipes per site and lists unknown ingredients. Never runs on main.
on:
  push:
    branches: [claude/recipe-count]
    paths: [demo/count.mts, .github/workflows/recipe-count.yml, scraper-backend/data/catalog/**]

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd scraper-backend && npm ci --ignore-scripts
      - name: Count
        run: |
          mkdir -p demo/count-out
          cd scraper-backend && node --experimental-strip-types --no-warnings ../demo/count.mts 2>&1 | tee ../demo/count-out/log.txt
      - name: Commit the results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add demo/count-out
          git commit -m "Count results [skip ci]" || echo "nothing to commit"
          git pull --rebase && git push
