name: Photo fetch

# Temporary: finds openly licensed appliance photos on Openverse for review. Never runs on main.
on:
  push:
    branches-ignore: [main]
    paths: [demo/fetch-photos.mjs, demo/appliance-stats.mjs, .github/workflows/photo-fetch.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Appliance counts
        working-directory: demo
        run: echo skip
      - name: Fetch
        timeout-minutes: 12
        working-directory: demo
        run: mkdir -p photos && cp photos/meta.json photos/meta-main.json; node fetch-photos.mjs photos | tee photos-log.txt
      - name: Contact sheet
        working-directory: demo/photos
        run: |
          sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          for k in stove oven oven_b oven_c air_fryer microwave grill steamer rice_cooker pressure_cooker slow_cooker blender mixer; do
            ls $k-*.jpg >/dev/null 2>&1 && montage -label '%f' $k-*.jpg -tile 6x1 -geometry 220x165+4+4 sheet-$k.png || true
          done
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add demo
          git commit -m "Add appliance photo candidates [skip ci]" || echo "nothing to commit"
          git push
