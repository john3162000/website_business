name: Recipe source survey

# Temporary: sizes up Filipino recipe sites (sitemaps, robots.txt, JSON-LD, terms). Never runs on main.
on:
  push:
    branches: [claude/source-survey]
    paths: [demo/survey.mjs, .github/workflows/source-survey.yml]

permissions:
  contents: write

jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Survey
        run: |
          mkdir -p demo/survey-out
          node demo/survey.mjs 2>&1 | tee demo/survey-out/log.txt
      - name: Commit the results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add demo/survey-out
          git commit -m "Survey results [skip ci]" || echo "nothing to commit"
          git pull --rebase && git push
