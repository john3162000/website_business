name: Settings preview

# Temporary: phone and desktop screenshots of Settings, filters, grocery sections and drag and drop. Never runs on main.
on:
  push:
    branches-ignore: [main]
    paths: [docs/**, demo/preview-settings.mjs, .github/workflows/settings-preview.yml]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: demo
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture
        working-directory: demo
        run: |
          python3 -m http.server 5173 --directory ../docs &
          sleep 2
          node preview-settings.mjs http://localhost:5173/ 2>&1 | tee settings-out/log.txt
      - name: Commit the preview
        if: always()
        run: |
          rm -rf demo/node_modules demo/package.json demo/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add demo/settings-out
          git commit -m "Add settings preview [skip ci]" || echo "nothing to commit"
          git pull --rebase && git push
