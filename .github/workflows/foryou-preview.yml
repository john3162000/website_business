name: For-you preview

# Temporary: phone screenshots of Para sa'yo and Kahawig na ulam. Never runs on main.
on:
  push:
    branches-ignore: [main]
    paths: [docs/taste.js, docs/app.js, demo/preview-foryou.mjs, .github/workflows/foryou-preview.yml]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: demo
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the site
        run: |
          python3 -m http.server 5173 --directory docs &
          sleep 2
      - name: Capture
        working-directory: demo
        run: node preview-foryou.mjs http://localhost:5173/ foryou-out | tee foryou-out/log.txt
      - name: Commit the preview
        if: always()
        run: |
          rm -rf demo/node_modules demo/package.json demo/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add demo/foryou-out
          git commit -m "Add for-you preview [skip ci]" || echo "nothing to commit"
          git push
