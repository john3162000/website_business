name: Prices width debug

# Temporary: finds what makes the Prices page wider than a phone. Never runs on main.
on:
  push:
    branches: [claude/prices-mobile]
    paths: [docs/**, demo/prices-debug.mjs, .github/workflows/prices-debug.yml]

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: demo
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Measure
        working-directory: demo
        run: |
          mkdir -p prices-out
          python3 -m http.server 5173 --directory ../docs &
          sleep 2
          node prices-debug.mjs http://localhost:5173/ 2>&1 | tee prices-out/log.txt
      - name: Commit the results
        if: always()
        run: |
          rm -rf demo/node_modules demo/package.json demo/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add demo/prices-out
          git commit -m "Prices debug results [skip ci]" || echo "nothing to commit"
          git pull --rebase && git push
