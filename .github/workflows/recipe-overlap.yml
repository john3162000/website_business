name: Recipe overlap count

# Temporary: counts Panlasang Pinoy + Kawaling Pinoy posts from their public sitemaps and the
# dishes both have. Reads page addresses only. Never runs on main.
on:
  push:
    branches: [claude/recipe-overlap]
    paths: [demo/overlap.mjs, .github/workflows/recipe-overlap.yml]

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Count
        run: |
          mkdir -p demo/overlap-out
          node demo/overlap.mjs 2>&1 | tee demo/overlap-out/log.txt
      - name: Commit the results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add demo/overlap-out
          git commit -m "Overlap results [skip ci]" || echo "nothing to commit"
          git pull --rebase && git push
